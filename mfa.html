<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171329"><title>STASH — Vérification</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script><style>
:root{color-scheme:dark;--bg:#100e1b;--panel:#1b1830;--muted:#aaa5c0;--pink:#ff5ba7;--orange:#ff9b5b;--line:#39334f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#38204b 0,transparent 34%),var(--bg);color:white;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,430px);background:#1b1830;border:1px solid #ffffff16;border-radius:26px;padding:28px;box-shadow:0 24px 80px #0006}h1{font-size:26px;margin:0 0 10px}.muted{color:var(--muted);font-size:14px;line-height:1.55}input{width:100%;border:1px solid var(--line);background:#100e1b;color:white;border-radius:13px;padding:15px;font:inherit;font-size:22px;letter-spacing:8px;text-align:center;margin:12px 0}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:14px;font-weight:800;margin-top:10px}.primary{background:linear-gradient(100deg,var(--pink),var(--orange));color:#201326}.secondary{background:transparent;border:1px solid var(--line);color:white}.status{font-size:13px;line-height:1.5;color:#ffc4d9;min-height:22px;margin-top:12px;overflow-wrap:anywhere}

/* STASH — nouvelle direction visuelle glass / noir */
:root{color-scheme:dark;--bg:#050506;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.085);--muted:#a7a7ad;--pink:#ff6cab;--orange:#ffad72;--line:rgba(255,255,255,.16);--white:#fff}
html{background:#050506}
body{background:radial-gradient(ellipse at 50% -18%,rgba(255,108,171,.13),transparent 42%),radial-gradient(ellipse at 100% 35%,rgba(255,173,114,.08),transparent 34%),#050506!important;color:#fff;font-family:'Poppins',Inter,system-ui,-apple-system,sans-serif!important;position:relative;isolation:isolate}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;width:clamp(150px,25vw,300px);height:clamp(150px,25vw,300px);right:clamp(-85px,5vw,90px);top:clamp(75px,15vh,170px);border:1px solid rgba(255,255,255,.22);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.015) 55%,rgba(255,108,171,.06));box-shadow:inset 0 0 45px rgba(255,255,255,.045),0 0 90px rgba(255,108,171,.08);backdrop-filter:blur(2px);transform:perspective(700px) rotateX(57deg) rotateZ(45deg);opacity:.48}
body:after{content:"";position:fixed;z-index:-1;pointer-events:none;width:clamp(110px,18vw,210px);height:clamp(110px,18vw,210px);right:clamp(-30px,12vw,180px);top:clamp(120px,22vh,240px);border:1px solid rgba(255,255,255,.12);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 70%);transform:perspective(700px) rotateX(57deg) rotateZ(45deg) translateZ(55px);opacity:.3}
.top{background:rgba(5,5,6,.76)!important;border-bottom:1px solid rgba(255,255,255,.12)!important;backdrop-filter:blur(22px)!important}
.brand strong,.logo{font-family:'Poppins',sans-serif!important;letter-spacing:.12em!important}
.mark{background:linear-gradient(135deg,var(--pink),var(--orange))!important;box-shadow:0 0 24px rgba(255,108,171,.2)}
main{position:relative;z-index:1}
:is(.hero,.welcome,.composer,.post,.sidebox,.rightside,.leftside,.panel,.card,.shell,.inbox,.chat,.modal,.item,.member,.search,.empty,.loading,.follow-dialog,.follow-dialog-head,.follow-list,.bottomnav){background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025))!important;border-color:rgba(255,255,255,.14)!important;box-shadow:0 16px 55px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.045)}
:is(.hero,.welcome){background:linear-gradient(125deg,rgba(255,108,171,.13),rgba(255,173,114,.055) 55%,rgba(255,255,255,.035))!important}
:is(.composer,.post,.card,.modal,.shell,.item,.member,.follow-dialog){backdrop-filter:blur(18px)}
:is(input,textarea,select,.field,.composer textarea,.search input){background:rgba(0,0,0,.42)!important;border-color:rgba(255,255,255,.18)!important;color:#fff!important}
:is(input,textarea,select,.field):focus{border-color:rgba(255,108,171,.75)!important;box-shadow:0 0 0 3px rgba(255,108,171,.09)}
:is(button,.back,.action,.tab,.open,.msgbtn,.bell,.confess-bell,.markall,.follow,.follow-person-action,.close){font-family:'Poppins',sans-serif!important;border-color:rgba(255,255,255,.19)!important}
:is(.primary,.save,.send,.message-btn,.follow:not(.on)){background:linear-gradient(105deg,var(--pink),var(--orange))!important;color:#170e13!important;border:0!important;box-shadow:0 7px 24px rgba(255,108,171,.16)}
:is(.back,.action,.tab,.open,.msgbtn,.bell,.confess-bell,.markall,.follow,.follow-person-action,.close,.secondary){background:rgba(255,255,255,.055)!important;color:#f7f4f5!important}
:is(.tab.active,.follow.on,.follow-person-action.on){background:rgba(255,108,171,.16)!important;border-color:rgba(255,108,171,.62)!important;color:#ffd4e6!important}
.bottomnav{background:rgba(5,5,6,.88)!important;border-top:1px solid rgba(255,255,255,.14)!important;backdrop-filter:blur(22px)!important}
:is(.bubble.mine){background:linear-gradient(120deg,#d9579a,#b47b9f)!important;color:#fff!important}
:is(.bubble:not(.mine),.body,.reply,.toast){background:rgba(255,255,255,.075)!important;border-color:rgba(255,255,255,.15)!important}
:is(.toast){backdrop-filter:blur(18px)}
@media(max-width:640px){body:before{right:-85px;top:115px;opacity:.35}body:after{right:-25px;top:165px;opacity:.22}}

</style></head><body><main class="card"><h1>Encore une petite vérification 🔐</h1><p class="muted">Saisis le code à 6 chiffres affiché dans ton application d’authentification pour accéder à STASH.</p><div id="factorText" class="muted">Préparation de la vérification…</div><form id="form"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="Code à 6 chiffres" required><button class="primary" id="verify" type="submit">Vérifier et continuer</button></form><button class="secondary" id="logout" type="button">Ce n’est pas mon compte — me déconnecter</button><div class="status" id="status" role="status"></div></main>
<script>
(()=>{const db=window.supabase.createClient('https://hhntssweslmmqskhoaje.supabase.co','sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3');const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const raw=params.get('next')||'index.html';const next=/^(index|member|messages|explore|notifications|settings|appeals)\.html(?:[?#].*)?$/.test(raw)?raw:'index.html';let factorId=null,challengeId=null;
async function start(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace('auth.html');return}const {data:aal,error:ae}=await db.auth.mfa.getAuthenticatorAssuranceLevel();if(ae)throw ae;if(aal.currentLevel==='aal2'){location.replace(next);return}const {data,error:fe}=await db.auth.mfa.listFactors();if(fe)throw fe;const factor=(data.totp||[]).find(x=>x.status==='verified');if(!factor)throw new Error('Aucun facteur TOTP vérifié. Reconnecte-toi ou contacte le support.');factorId=factor.id;$('factorText').textContent='Application associée : '+(factor.friendly_name||'Authentificateur');const ch=await db.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;challengeId=ch.data.id;$('status').textContent='Ouvre ton application et saisis le code actuel.'}
$('form').addEventListener('submit',async e=>{e.preventDefault();const code=$('code').value.replace(/\D/g,'');if(code.length!==6){$('status').textContent='Le code doit contenir 6 chiffres.';return}const btn=$('verify');btn.disabled=true;$('status').textContent='Vérification…';try{const {error}=await db.auth.mfa.verify({factorId,challengeId,code});if(error)throw error;location.replace(next)}catch(err){$('status').textContent=err.message||'Code invalide ou expiré. Réessaie.';try{const ch=await db.auth.mfa.challenge({factorId});if(!ch.error)challengeId=ch.data.id}catch(_){}}finally{btn.disabled=false;$('code').value=''}});
$('logout').onclick=async()=>{await db.auth.signOut({scope:'local'});location.replace('auth.html')};start().catch(e=>{$('factorText').textContent='Impossible de préparer la vérification.';$('status').textContent=e.message||String(e);$('verify').disabled=true});
})();
</script></body></html>
