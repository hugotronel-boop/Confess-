  userId=id;
  if(!id){badge.hidden=true;return}
  channel=client.channel('confess-page-notifications-'+id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .subscribe();
  countUnread();
 }
 async function init(){const {data:{session}}=await client.auth.getSession();await connect(session?.user?.id||null)}
 document.getElementById('confessBell').addEventListener('click',()=>location.href='notifications.html');
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){connect(null);return}
  if(session?.user?.id)setTimeout(()=>connect(session.user.id),0);
 });
 init();
 window.addEventListener('beforeunload',()=>{if(channel)client.removeChannel(channel)});
})();
</script>

const file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
const map={'index.html':'home','messages.html':'messages','publish.html':'publish','notifications.html':'notifications','explore.html':'home','profile.html':'profile','settings.html':'profile','member.html':'profile','admin.html':'profile','moderation.html':'profile','appeals.html':'profile','sanctions.html':'profile'};

<script id="stash-keyboard-nav">
(()=>{
 const nav=document.querySelector('.confess-global-nav');
 if(!nav||nav.dataset.keyboardAware==='1')return;
 nav.dataset.keyboardAware='1';
 const vv=window.visualViewport;
 const update=()=>{
  const gap=vv?Math.max(0,window.innerHeight-(vv.height+vv.offsetTop)):0;
  nav.style.setProperty('bottom',gap+'px','important');
 };
 update();
 if(vv){vv.addEventListener('resize',update);vv.addEventListener('scroll',update)}
 window.addEventListener('resize',update);
 document.addEventListener('focusin',event=>{
  if(event.target.matches('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))requestAnimationFrame(update);
 });
 document.addEventListener('focusout',()=>setTimeout(update,180));
})();
</script>
