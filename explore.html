<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>STASH — Recherche</title>

<script src="./mfa-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050506;--muted:#99999f;--line:rgba(255,255,255,.13);--pink:#ff6cab;--orange:#ffad72}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050506;color:#fff;font-family:Poppins,Inter,system-ui,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input{font:inherit}
button{cursor:pointer}
.top{height:58px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:13px;padding:0 17px;background:rgba(5,5,6,.96);backdrop-filter:blur(20px);border-bottom:0}
.back{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:0;background:transparent;color:#fff;font-size:21px;line-height:1}
.top-title{font-size:21px;font-weight:750;letter-spacing:-.5px}
main{width:min(680px,100%);margin:0 auto;padding:10px 16px 35px}
.search-wrap{position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:#aaa;fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
#searchInput{width:100%;height:56px;padding:0 48px 0 47px;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.065);color:#fff;outline:none;font-size:16px}
#searchInput:focus{border-color:rgba(255,108,171,.65);box-shadow:0 0 0 3px rgba(255,108,171,.08)}
#searchInput::placeholder{color:#77777e}
.clear-input{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#aaa;font-size:20px;display:none}
.clear-input.visible{display:block}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.section-head h2{font-size:14px;font-weight:700;margin:0}
.clear-history{border:0;background:transparent;color:#ff9bc5;font-size:11px;font-weight:600;padding:7px 0}
.people{display:grid}
.person{width:100%;display:flex;align-items:center;gap:12px;padding:12px 2px;border:0;border-bottom:1px solid rgba(255,255,255,.09);background:transparent;color:#fff;text-align:left}
.person:active{opacity:.7}
.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#ff6cab,#ffad72);color:#190e14;font-size:17px;font-weight:800}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{min-width:0;flex:1}
.person-info strong{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-info span{display:block;margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-arrow{color:#777;font-size:20px;padding:0 5px}
.remove-person{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:50%;background:transparent;color:#85858b;font-size:20px}
.empty{padding:34px 15px;text-align:center;color:#85858b;font-size:12px;line-height:1.6}
.hint{padding:26px 12px;text-align:center;color:#77777e;font-size:12px}
.loading{padding:25px 12px;text-align:center;color:#999;font-size:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:50;padding:11px 15px;border-radius:12px;background:#242428;border:1px solid var(--line);font-size:12px;display:none}
.toast.show{display:block}
.confess-global-nav{display:flex!important;position:fixed!important;left:50%!important;bottom:0!important;transform:translateX(-50%)!important;width:min(760px,100%)!important;z-index:9999!important;justify-content:space-around!important;align-items:center!important;gap:4px!important;padding:9px 10px calc(9px + env(safe-area-inset-bottom))!important;border:1px solid rgba(255,255,255,.14)!important;border-bottom:0!important;border-radius:18px 18px 0 0!important;background:rgba(5,5,6,.94)!important;backdrop-filter:blur(22px)!important}
.confess-global-nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#c8c1d9;font-size:10px;padding:4px 1px;border-radius:11px}
.confess-global-nav a[aria-current=page]{color:#ff9fc7;background:rgba(255,108,171,.12)}
.confess-global-nav a span{font:inherit}
@media(max-width:420px){main{padding:20px 15px}.confess-global-nav{gap:0;padding-left:4px;padding-right:4px}.confess-global-nav a{font-size:9px}}

/* STASH — rendu des photos identique au format de la page profil */
.avatar,.post-avatar,.comment-avatar,.settings-person-avatar,.symbol,.publish-author-avatar,#avatar,#userAvatar,#composeAvatar{border-radius:50%!important;overflow:hidden!important;}
.avatar img,.post-avatar img,.comment-avatar img,.settings-person-avatar img,.symbol img,.publish-author-avatar img,#avatar img,#userAvatar img,#composeAvatar img{display:block!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:center!important;border-radius:50%!important;}
</style>
</head>
<body>
<header class="top"><button class="back" type="button" onclick="location.href='index.html'" aria-label="Retour au fil">&lt;</button><div class="top-title">Rechercher</div></header>
<main>
 <div class="search-wrap">
  <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
  <input id="searchInput" type="search" maxlength="40" placeholder="Rechercher un membre…" autocomplete="off" autocapitalize="none" spellcheck="false">
  <button class="clear-input" id="clearInput" type="button" aria-label="Effacer la recherche">×</button>
 </div>
 <section id="historySection">
  <div class="section-head"><h2>Récents</h2><button class="clear-history" id="clearHistory" type="button">Tout effacer</button></div>
  <div class="people" id="historyList"></div>
 </section>
 <section id="resultsSection" hidden>
  <div class="section-head"><h2>Résultats</h2></div>
  <div class="people" id="resultsList"></div>
 </section>
 <div class="toast" id="toast"></div>
</main>
<nav class="confess-global-nav" aria-label="Navigation principale">
 <a href="./index.html" data-nav="home"><span>Feed</span></a>
 <a href="./messages.html" data-nav="messages"><span>Message</span></a>
 <a href="./publish.html" data-nav="publish"><span>+</span></a>
 <a href="./notifications.html" data-nav="notifications"><span>Actus</span></a>
 <a href="./profile.html" data-nav="profile"><span>Profil</span></a>
</nav>
<script>
(()=>{
const URL='https://hhntssweslmmqskhoaje.supabase.co',KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let userId='guest',historyItems=[],timer=null,requestNumber=0;
const historyKey=()=> 'stash_search_history_'+userId;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatarHTML(person){const fallback=esc((person.username||'?').trim().charAt(0).toUpperCase());if(person.avatar_path){const url=db.storage.from('confess-avatars').getPublicUrl(person.avatar_path).data.publicUrl;return '<img alt="" src="'+esc(url)+'">'}return fallback}
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function readHistory(){try{const raw=JSON.parse(localStorage.getItem(historyKey())||'[]');historyItems=Array.isArray(raw)?raw.filter(x=>x&&x.id&&x.username).slice(0,30):[]}catch{historyItems=[]}}
function saveHistory(){try{localStorage.setItem(historyKey(),JSON.stringify(historyItems.slice(0,30)))}catch{}}
function renderHistory(){
 const section=$('historySection'),list=$('historyList');
 section.hidden=$('searchInput').value.trim().length>0;
 $('clearHistory').hidden=!historyItems.length;
 if(!historyItems.length){list.innerHTML='<div class="empty">Tes recherches récentes apparaîtront ici.</div>';return}
 list.innerHTML=historyItems.map(p=>'<div class="person" data-history-row="'+esc(p.id)+'"><div class="avatar">'+avatarHTML(p)+'</div><div class="person-info"><strong>@'+esc(p.username)+'</strong><span>Membre STASH</span></div><button class="remove-person" type="button" data-remove="'+esc(p.id)+'" aria-label="Supprimer de l’historique">×</button></div>').join('');
 list.querySelectorAll('[data-history-row]').forEach(row=>row.addEventListener('click',e=>{if(e.target.closest('[data-remove]'))return;location.href='member.html?id='+encodeURIComponent(row.dataset.historyRow)}));
 list.querySelectorAll('[data-remove]').forEach(button=>button.addEventListener('click',e=>{e.stopPropagation();historyItems=historyItems.filter(p=>p.id!==button.dataset.remove);saveHistory();renderHistory()}));
}
function renderResults(people,query){
 const list=$('resultsList');
 if(!people.length){list.innerHTML='<div class="empty">Aucun membre trouvé pour « '+esc(query)+' ».</div>';return}
 list.innerHTML=people.map(p=>'<button class="person" type="button" data-result="'+esc(p.id)+'"><span class="avatar">'+avatarHTML(p)+'</span><span class="person-info"><strong>@'+esc(p.username)+'</strong><span>'+esc(p.bio||'Membre de STASH')+'</span></span><span class="person-arrow">›</span></button>').join('');
 list.querySelectorAll('[data-result]').forEach(button=>button.addEventListener('click',()=>{
  const p=people.find(x=>x.id===button.dataset.result);if(!p)return;
  historyItems=[p,...historyItems.filter(x=>x.id!==p.id)].slice(0,30);saveHistory();
  location.href='member.html?id='+encodeURIComponent(p.id);
 }));
}
async function searchPeople(raw){
 const query=raw.trim(),sequence=++requestNumber;
 if(query.length<2){$('resultsSection').hidden=true;renderHistory();return}
 $('historySection').hidden=true;$('resultsSection').hidden=false;
 $('resultsList').innerHTML='<div class="loading">Recherche en cours…</div>';
 const safe=query.replace(/[%_,]/g,' ').replace(/[()]/g,' ').trim();
 if(!safe){$('resultsList').innerHTML='<div class="empty">Saisis un pseudo pour commencer.</div>';return}
 const {data,error}=await db.from('profiles').select('id,username,bio,avatar_path').ilike('username','%'+safe+'%').order('username').limit(25);
 if(sequence!==requestNumber)return;
 if(error){console.error('STASH search:',error);$('resultsList').innerHTML='<div class="empty">La recherche est momentanément indisponible.</div>';return}
 renderResults((data||[]).filter(p=>p.id!==userId),query);
}
$('searchInput').addEventListener('input',()=>{
 const value=$('searchInput').value;
 $('clearInput').classList.toggle('visible',!!value);
 clearTimeout(timer);
 if(value.trim().length<2){requestNumber++;$('resultsSection').hidden=true;renderHistory();return}
 timer=setTimeout(()=>searchPeople(value),260);
});
$('clearInput').addEventListener('click',()=>{$('searchInput').value='';$('clearInput').classList.remove('visible');requestNumber++;$('resultsSection').hidden=true;renderHistory();$('searchInput').focus()});
$('clearHistory').addEventListener('click',()=>{if(!historyItems.length)return;historyItems=[];saveHistory();renderHistory();toast('Historique effacé')});
async function init(){
 const {data:{session}}=await db.auth.getSession();
 userId=session?.user?.id||'guest';
 readHistory();renderHistory();
}
init();
})();
</script>
<script id="stash-nav-current-page">
(()=>{const nav=document.querySelector('.confess-global-nav');if(!nav)return;const file=(location.pathname.split('/').pop()||'index.html').toLowerCase();const map={'index.html':'home','messages.html':'messages','publish.html':'publish','notifications.html':'notifications','explore.html':'home','profile.html':'profile','settings.html':'profile','member.html':'profile'};const current=map[file]||'home';nav.querySelectorAll('a[data-nav]').forEach(a=>{const active=a.dataset.nav===current;a.classList.toggle('stash-nav-current',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})})();
</script>

<script id="stash-realtime-online-presence">
(()=>{
 if(!window.supabase?.createClient||window.__stashPresenceStarted)return;
 window.__stashPresenceStarted=true;
 const client=window.supabase.createClient('https://hhntssweslmmqskhoaje.supabase.co','sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3');
 let channel=null,userId=null,tracked=false,starting=false;
 const render=()=>{
  const online=new Set();
  if(channel){const state=channel.presenceState()||{};Object.values(state).flat().forEach(p=>{if(p?.userId)online.add(String(p.userId))})}
  document.querySelectorAll('[data-stash-online]').forEach(el=>el.classList.toggle('stash-is-online',online.has(el.dataset.stashOnline)));
 };
 async function track(){if(!channel||!userId||tracked||document.visibilityState==='hidden')return;try{await channel.track({userId,onlineAt:new Date().toISOString()});tracked=true}catch(e){console.warn('STASH presence track:',e.message)}}
 async function connect(id){if(id===userId&&channel){if(document.visibilityState!=='hidden')track();return}if(channel){try{await client.removeChannel(channel)}catch(e){}channel=null}userId=id;tracked=false;if(!id){render();return}channel=client.channel('stash-global-online').on('presence',{event:'sync'},render).on('presence',{event:'join'},render).on('presence',{event:'leave'},render).subscribe(status=>{if(status==='SUBSCRIBED')track()});}
 client.auth.getSession().then(({data})=>connect(data.session?.user?.id||null));
 client.auth.onAuthStateChange((event,session)=>setTimeout(()=>connect(session?.user?.id||null),0));
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(channel&&tracked){channel.untrack();tracked=false}}else track()});
 window.addEventListener('focus',track);window.addEventListener('beforeunload',()=>{if(channel)client.removeChannel(channel)});
})();
</script>

<a href="./index.html" data-nav="home" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.8l8.5 7v9a1.7 1.7 0 0 1-1.7 1.7h-14a1.7 1.7 0 0 1-1.7-1.7z"/><path d="M9 21.3v-7h6v7"/></svg></a>

<a href="./publish.html" data-nav="publish" class="nav-publish-center" aria-label="Publier" title="Publier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>

</nav>

}
html body nav.confess-global-nav.stash-threads-nav>a.nav-publish-center svg{width:27px!important;height:27px!important;stroke-width:1.8!important}
html body nav.confess-global-nav.stash-threads-nav .stash-nav-notif-count{

 padding:0 4px!important;border-radius:99px!important;background:#fff!important;color:#050506!important;
 font:800 9px/16px Arial,sans-serif!important;
}
html body nav.confess-global-nav.stash-threads-nav .stash-nav-notif-count[hidden]{display:none!important}
html body nav.confess-global-nav.stash-threads-nav .stash-nav-message-count{display:none!important}
html body{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}
@media(max-width:420px){
 html body nav.bottomnav.confess-global-nav.stash-threads-nav{padding-left:8px!important;padding-right:8px!important}
 html body nav.confess-global-nav.stash-threads-nav>a svg{width:24px!important;height:24px!important}

</style>
<script id="stash-nav-current-page">
(()=>{const nav=document.querySelector('.confess-global-nav');if(!nav)return;
const file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
const map={'index.html':'home','messages.html':'messages','explore.html':'search','publish.html':'publish','notifications.html':'notifications','profile.html':'profile','settings.html':'profile','member.html':'profile','admin.html':'profile','moderation.html':'profile','appeals.html':'profile','sanctions.html':'profile'};
const current=map[file]||'home';
nav.querySelectorAll('a[data-nav]').forEach(a=>{const selected=a.dataset.nav===current;a.classList.toggle('stash-nav-current',selected);a.classList.toggle('stash-bubble-active',selected);if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
})();
</script>
