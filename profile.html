<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e1b"><title>CONFESS — Mon profil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
<style>
:root{color-scheme:dark;--bg:#100e1b;--panel:#1b1830;--panel2:#24203b;--muted:#aaa5c0;--pink:#ff5ba7;--orange:#ff9b5b;--line:#39334f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,#38204b 0,transparent 30%),var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:35px}button,input,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#100e1bed;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:12px max(16px,calc((100vw - 900px)/2));display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;font-weight:950;font-size:21px;color:#201326}.brand strong{letter-spacing:2px;font-size:19px}.back{border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:30px;padding:9px 13px;font-size:12px}
main{width:min(760px,100%);margin:26px auto;padding:0 15px}.hero{background:linear-gradient(125deg,#42203f,#26203f 62%,#30203c);border:1px solid #ffffff14;border-radius:25px;padding:24px;margin-bottom:15px}.hero h1{font-size:23px;margin:0 0 6px}.hero p{color:#ded4e8;font-size:13px;margin:0}.card{background:var(--panel);border:1px solid #ffffff13;border-radius:22px;padding:19px;margin-bottom:15px}.profile-head{display:flex;gap:17px;align-items:center;margin-bottom:19px}.avatar-wrap{position:relative;flex:none}.avatar{width:94px;height:94px;border-radius:28px;background:linear-gradient(135deg,#ff5ba7,#8f6bff);display:grid;place-items:center;font-size:34px;font-weight:850;overflow:hidden;border:2px solid #ffffff20}.avatar img{width:100%;height:100%;object-fit:cover}.change{position:absolute;right:-7px;bottom:-7px;border:2px solid var(--panel);border-radius:50%;width:34px;height:34px;background:var(--orange);color:#211426;font-weight:900}.identity{min-width:0}.identity h2{font-size:20px;margin:0 0 5px;overflow-wrap:anywhere}.identity p{font-size:12px;color:var(--muted);margin:0}.field-label{display:block;color:#ded8eb;font-size:12px;margin:15px 0 7px}.field{width:100%;background:#100e1b;border:1px solid var(--line);border-radius:13px;padding:12px;color:#fff;outline:none}.field:focus{border-color:var(--pink)}textarea.field{min-height:92px;resize:vertical;line-height:1.5}.hint{font-size:11px;color:var(--muted);margin:6px 2px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.primary{border:0;border-radius:12px;background:linear-gradient(100deg,var(--pink),var(--orange));color:#241326;font-weight:850;padding:12px 17px;font-size:13px}.secondary{border:1px solid var(--line);border-radius:12px;background:transparent;color:#eee;padding:11px 15px;font-size:13px}.danger{color:#ff9cae;border-color:#73394e}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 3px 12px}.section-head h2{font-size:17px;margin:0}.count{font-size:11px;color:var(--muted)}.post{background:var(--panel);border:1px solid #ffffff13;border-radius:18px;padding:16px;margin-bottom:11px}.post-meta{font-size:11px;color:var(--muted);margin-bottom:10px}.post-body{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.post-foot{display:flex;justify-content:space-between;border-top:1px solid #ffffff12;margin-top:13px;padding-top:10px;color:var(--muted);font-size:11px}.empty,.loading{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#302744;border:1px solid #ffffff22;color:#fff;padding:12px 16px;border-radius:13px;font-size:12px;z-index:20;display:none;max-width:90%;text-align:center}.toast.show{display:block}
@media(max-width:520px){main{margin:16px auto}.hero{padding:19px}.card{padding:16px}.avatar{width:78px;height:78px;border-radius:24px}.profile-head{gap:13px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">C</div><strong>CONFESS</strong></div><div style="display:flex;gap:8px;align-items:center"><button class="back" onclick="location.href='settings.html'">⚙️ Paramètres</button><button class="back" onclick="location.href='index.html'">← Retour au fil</button></div></header>
<main>
<section class="hero"><h1>Ton espace, tes mots. ✨</h1><p>Personnalise ton profil et retrouve tes publications publiques.</p></section>
<section class="card">
 <div class="profile-head"><div class="avatar-wrap"><div class="avatar" id="avatar">?</div><button class="change" id="pickAvatar" aria-label="Changer la photo">＋</button><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><div class="identity"><h2 id="displayName">Mon profil</h2><p id="memberSince">Membre CONFESS</p></div></div>
 <form id="profileForm">
  <label class="field-label" for="username">Pseudonyme</label><input class="field" id="username" maxlength="20" minlength="3" pattern="[A-Za-z0-9_]{3,20}" required>
  <p class="hint">3 à 20 caractères : lettres, chiffres et _ uniquement. Il doit être unique.</p>
  <label class="field-label" for="bio">Ma présentation</label><textarea class="field" id="bio" maxlength="180" placeholder="Quelques mots pour te présenter…"></textarea><p class="hint">180 caractères maximum.</p>
  <div class="actions"><button class="primary" id="saveBtn" type="submit">Enregistrer les modifications</button><button class="secondary" id="logoutBtn" type="button">Me déconnecter</button></div>
 </form>
</section>
<div class="section-head"><h2>Mes publications</h2><span class="count" id="postCount">—</span></div>
<div id="myPosts"><div class="loading">Chargement de ton espace…</div></div>
</main><div class="toast" id="toast"></div>
<script>
(() => {
const URL='https://hhntssweslmmqskhoaje.supabase.co';
const KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3';
const db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);
let user=null,profile=null;
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showAvatar(path){const el=$('avatar');if(path){const {data}=db.storage.from('confess-avatars').getPublicUrl(path);el.innerHTML='<img alt="Photo de profil" src="'+esc(data.publicUrl)+'">'}else el.textContent=(profile?.username||'?').slice(0,1).toUpperCase()}
async function load(){
 const {data:{session}}=await db.auth.getSession();user=session?.user;
 if(!user){location.href='auth.html';return}
 const {data,error}=await db.from('profiles').select('id,username,bio,avatar_path,created_at').eq('id',user.id).maybeSingle();
 if(error||!data){toast("Impossible de charger ton profil.");console.error(error);return}
 profile=data;$('username').value=data.username||'';$('bio').value=data.bio||'';$('displayName').textContent='@'+(data.username||'membre');$('memberSince').textContent='Membre depuis le '+new Date(data.created_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});showAvatar(data.avatar_path);await loadPosts();
}
async function loadPosts(){
 const {data,error}=await db.from('posts').select('id,body,created_at,categories(label)').eq('author_profile_id',user.id).eq('is_anonymous',false).eq('status','published').order('created_at',{ascending:false}).limit(50);
 if(error){$('myPosts').innerHTML='<div class="empty">Impossible de charger tes publications.</div>';console.error(error);return}
 const rows=data||[];$('postCount').textContent=rows.length+' publication'+(rows.length>1?'s':'');
 $('myPosts').innerHTML=rows.length?rows.map(p=>'<article class="post"><div class="post-meta">'+new Date(p.created_at).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})+' · '+esc(p.categories?.label||'Discussion')+'</div><div class="post-body">'+esc(p.body)+'</div></article>').join(''):'<div class="empty">Tu n’as pas encore de publication publique.<br>Ton prochain post t’attend sur le fil 👀</div>';
}
$('profileForm').addEventListener('submit',async e=>{
 e.preventDefault();const username=$('username').value.trim(),bio=$('bio').value.trim();
 if(!/^[A-Za-z0-9_]{3,20}$/.test(username))return toast('Pseudo invalide : 3 à 20 caractères, lettres, chiffres ou _.');
 $('saveBtn').disabled=true;
 const {error}=await db.from('profiles').update({username,bio}).eq('id',user.id);
 $('saveBtn').disabled=false;
 if(error){toast(error.code==='23505'?'Ce pseudonyme est déjà utilisé.':"Enregistrement impossible : "+error.message);return}
 profile={...profile,username,bio};$('displayName').textContent='@'+username;toast('Profil mis à jour ✨');
});
$('pickAvatar').onclick=()=>$('avatarFile').click();
$('avatarFile').addEventListener('change',async()=>{
 const file=$('avatarFile').files?.[0];if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Format accepté : JPG, PNG ou WebP.');
 if(file.size>2*1024*1024)return toast('La photo doit faire 2 Mo maximum.');
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=user.id+'/avatar.'+ext;
 const {data,error}=await db.storage.from('confess-avatars').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'3600'});
 if(error){toast("Envoi de la photo impossible : "+error.message);return}
 const {error:saveError}=await db.from('profiles').update({avatar_path:data.path}).eq('id',user.id);
 if(saveError){toast("Photo envoyée mais profil non actualisé.");console.error(saveError);return}
 profile.avatar_path=data.path;showAvatar(data.path);toast('Photo de profil mise à jour !');
});
$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.href='index.html'};
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.href='auth.html'});
load();
})();
</script>
</body></html>
