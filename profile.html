/* STASH — nouvelle direction visuelle glass / noir */
:root{color-scheme:dark;--bg:#050506;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.085);--muted:#a7a7ad;--pink:#ff6cab;--orange:#ffad72;--line:rgba(255,255,255,.16);--white:#fff}
html{background:#050506}
body{background:radial-gradient(ellipse at 50% -18%,rgba(255,108,171,.13),transparent 42%),radial-gradient(ellipse at 100% 35%,rgba(255,173,114,.08),transparent 34%),#050506!important;color:#fff;font-family:'Poppins',Inter,system-ui,-apple-system,sans-serif!important;position:relative;isolation:isolate}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;width:clamp(150px,25vw,300px);height:clamp(150px,25vw,300px);right:clamp(-85px,5vw,90px);top:clamp(75px,15vh,170px);border:1px solid rgba(255,255,255,.22);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.015) 55%,rgba(255,108,171,.06));box-shadow:inset 0 0 45px rgba(255,255,255,.045),0 0 90px rgba(255,108,171,.08);backdrop-filter:blur(2px);transform:perspective(700px) rotateX(57deg) rotateZ(45deg);opacity:.48}
body:after{content:"";position:fixed;z-index:-1;pointer-events:none;width:clamp(110px,18vw,210px);height:clamp(110px,18vw,210px);right:clamp(-30px,12vw,180px);top:clamp(120px,22vh,240px);border:1px solid rgba(255,255,255,.12);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 70%);transform:perspective(700px) rotateX(57deg) rotateZ(45deg) translateZ(55px);opacity:.3}
.top{background:rgba(5,5,6,.76)!important;border-bottom:1px solid rgba(255,255,255,.12)!important;backdrop-filter:blur(22px)!important}
.brand strong,.logo{font-family:'Poppins',sans-serif!important;letter-spacing:.12em!important}
.mark{background:linear-gradient(135deg,var(--pink),var(--orange))!important;box-shadow:0 0 24px rgba(255,108,171,.2)}
main{position:relative;z-index:1}
:is(.hero,.welcome,.composer,.post,.sidebox,.rightside,.leftside,.panel,.card,.shell,.inbox,.chat,.modal,.item,.member,.search,.empty,.loading,.follow-dialog,.follow-dialog-head,.follow-list,.bottomnav){background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025))!important;border-color:rgba(255,255,255,.14)!important;box-shadow:0 16px 55px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.045)}
:is(.hero,.welcome){background:linear-gradient(125deg,rgba(255,108,171,.13),rgba(255,173,114,.055) 55%,rgba(255,255,255,.035))!important}
:is(.composer,.post,.card,.modal,.shell,.item,.member,.follow-dialog){backdrop-filter:blur(18px)}
:is(input,textarea,select,.field,.composer textarea,.search input){background:rgba(0,0,0,.42)!important;border-color:rgba(255,255,255,.18)!important;color:#fff!important}
:is(input,textarea,select,.field):focus{border-color:rgba(255,108,171,.75)!important;box-shadow:0 0 0 3px rgba(255,108,171,.09)}
:is(button,.back,.action,.tab,.open,.msgbtn,.bell,.confess-bell,.markall,.follow,.follow-person-action,.close){font-family:'Poppins',sans-serif!important;border-color:rgba(255,255,255,.19)!important}
:is(.primary,.save,.send,.message-btn,.follow:not(.on)){background:linear-gradient(105deg,var(--pink),var(--orange))!important;color:#170e13!important;border:0!important;box-shadow:0 7px 24px rgba(255,108,171,.16)}
:is(.back,.action,.tab,.open,.msgbtn,.bell,.confess-bell,.markall,.follow,.follow-person-action,.close,.secondary){background:rgba(255,255,255,.055)!important;color:#f7f4f5!important}
:is(.tab.active,.follow.on,.follow-person-action.on){background:rgba(255,108,171,.16)!important;border-color:rgba(255,108,171,.62)!important;color:#ffd4e6!important}
.bottomnav{background:rgba(5,5,6,.88)!important;border-top:1px solid rgba(255,255,255,.14)!important;backdrop-filter:blur(22px)!important}
:is(.bubble.mine){background:linear-gradient(120deg,#d9579a,#b47b9f)!important;color:#fff!important}
:is(.bubble:not(.mine),.body,.reply,.toast){background:rgba(255,255,255,.075)!important;border-color:rgba(255,255,255,.15)!important}
:is(.toast){backdrop-filter:blur(18px)}

// Compresse et convertit les photos directement dans le navigateur avant l'envoi.
async function prepareAvatarImage(file){
 let source=null,objectUrl=null;
 try{
  if('createImageBitmap' in window){
   try{source=await createImageBitmap(file)}catch(bitmapError){console.warn('Décodage createImageBitmap indisponible, essai avec Image:',bitmapError)}
  }
  if(!source){
   objectUrl=URL.createObjectURL(file);
   source=await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error("Ce format d’image n’est pas lisible par Safari. Essaie de l’enregistrer en JPEG."));
    img.src=objectUrl;
   });
  }
  const maxBytes=1800*1024;
  let width=source.width,height=source.height;
  if(!width||!height)throw new Error("Impossible de lire les dimensions de cette photo.");
  const maxSide=2400;
  if(Math.max(width,height)>maxSide){
   const ratio=maxSide/Math.max(width,height);
   width=Math.round(width*ratio);height=Math.round(height*ratio);
  }
  for(let pass=0;pass<8;pass++){
   const canvas=document.createElement('canvas');
   canvas.width=width;canvas.height=height;
   const ctx=canvas.getContext('2d',{alpha:false});
   if(!ctx)throw new Error("La compression d’image n’est pas disponible sur cet appareil.");
   ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
   ctx.drawImage(source,0,0,width,height);
   for(const quality of [.88,.82,.76,.70,.64,.58]){
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
    if(blob&&blob.size<=maxBytes){
     canvas.width=0;canvas.height=0;
     return new File([blob],'stash-avatar.jpg',{type:'image/jpeg',lastModified:Date.now()});
    }
   }
   canvas.width=0;canvas.height=0;
   width=Math.round(width*.78);height=Math.round(height*.78);
   if(width<320||height<320)break;
  }
  throw new Error("Cette photo est trop volumineuse pour être compressée correctement.");
 }finally{
  if(source&&typeof source.close==='function')source.close();
  if(objectUrl)URL.revokeObjectURL(objectUrl);
 }
}
$('avatarFile').accept='image/*';
$('avatarFile').addEventListener('change',async()=>{
 const input=$('avatarFile');
 const file=input.files?.[0];
 input.value='';
 if(!file)return;
 const oldPath=profile?.avatar_path||null;
 const bucket=db.storage.from('confess-avatars');
 const trigger=$('avatar');
 trigger.setAttribute('aria-busy','true');
 trigger.style.opacity='.55';
 try{
  toast('Préparation de ta photo…');
  const compressedFile=await prepareAvatarImage(file);
  console.info('STASH avatar: fichier préparé',{original:file.size,compressed:compressedFile.size,type:compressedFile.type});
  if(compressedFile.size>2*1024*1024)throw new Error("La photo compressée dépasse encore la limite autorisée.");
  const path=user.id+'/avatar-'+Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.jpg';
  toast('Envoi de la nouvelle photo…');
  const {data:uploaded,error:uploadError}=await bucket.upload(path,compressedFile,{upsert:false,contentType:'image/jpeg',cacheControl:'0'});
  if(uploadError)throw new Error("Envoi de la photo impossible : "+uploadError.message);
  if(!uploaded?.path)throw new Error("Supabase n’a pas renvoyé le chemin de la nouvelle photo.");
  toast('Enregistrement du profil…');
  const {data:updated,error:updateError}=await db.from('profiles').update({avatar_path:uploaded.path}).eq('id',user.id).select('avatar_path').maybeSingle();
  if(updateError||updated?.avatar_path!==uploaded.path){
   await bucket.remove([uploaded.path]);
   throw new Error(updateError?.message||"La base de données n’a pas confirmé le changement de photo. L’ancienne photo est conservée.");
  }
  const {data:confirmed,error:confirmError}=await db.from('profiles').select('avatar_path').eq('id',user.id).maybeSingle();
  if(confirmError||confirmed?.avatar_path!==uploaded.path){
   throw new Error("La nouvelle photo a été envoyée, mais la base de données renvoie encore l’ancien chemin.");
  }
  profile={...profile,avatar_path:confirmed.avatar_path};
  showAvatar(confirmed.avatar_path);
  const image=$('avatar').querySelector('img');
  if(image){
   await new Promise((resolve,reject)=>{
    image.onload=resolve;
    image.onerror=()=>reject(new Error("La photo est enregistrée, mais son affichage a échoué. Recharge la page."));
    if(image.complete&&image.naturalWidth>0)resolve();
   });
  }
  if(oldPath&&oldPath!==confirmed.avatar_path){
   const {error:removeError}=await bucket.remove([oldPath]);
   if(removeError)console.warn('Ancienne photo non supprimée:',removeError);
  }
  toast('Nouvelle photo enregistrée et affichée !');
 }catch(error){
  console.error('Erreur changement photo:',error);
  toast(error.message||'Une erreur est survenue pendant le changement de photo.');
 }finally{
  trigger.removeAttribute('aria-busy');
  trigger.style.opacity='';
 }
});
;

<script>
(()=> {
 if(!window.supabase?.createClient)return;
 const client=window.supabase.createClient('https://hhntssweslmmqskhoaje.supabase.co','sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3');
 const badge=document.getElementById('confessBellCount');
 let channel=null,userId=null;
 async function countUnread(){
  const {data:{session}}=await client.auth.getSession();
  const id=session?.user?.id||null;
  if(!id){badge.hidden=true;return}
  const {count,error}=await client.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',id).eq('is_read',false);
  if(error){console.warn('STASH notifications:',error.message);return}
  badge.textContent=(count||0)>99?'99+':String(count||0);
  badge.hidden=!count;
 }
 async function connect(id){
  if(id===userId&&channel)return;
  if(channel){await client.removeChannel(channel);channel=null}
  userId=id;
  if(!id){badge.hidden=true;return}
  channel=client.channel('confess-page-notifications-'+id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .subscribe();
  countUnread();
 }
 async function init(){const {data:{session}}=await client.auth.getSession();await connect(session?.user?.id||null)}
 const bell=document.getElementById('confessBell');if(bell)bell.addEventListener('click',()=>location.href='notifications.html');
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){connect(null);return}
  if(session?.user?.id)setTimeout(()=>connect(session.user.id),0);
 });
 init();
 window.addEventListener('beforeunload',()=>{if(channel)client.removeChannel(channel)});
})();
</script>

<script id="stash-keyboard-nav">
(()=>{
 const nav=document.querySelector('.confess-global-nav');
 if(!nav||nav.dataset.keyboardAware==='1')return;
 nav.dataset.keyboardAware='1';
 const vv=window.visualViewport;
 const update=()=>{
  const gap=vv?Math.max(0,window.innerHeight-(vv.height+vv.offsetTop)):0;
  nav.style.setProperty('bottom',gap+'px','important');
 };
 update();
 if(vv){vv.addEventListener('resize',update);vv.addEventListener('scroll',update)}
 window.addEventListener('resize',update);
 document.addEventListener('focusin',event=>{
  if(event.target.matches('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))requestAnimationFrame(update);
 });
 document.addEventListener('focusout',()=>setTimeout(update,180));
})();
</script>

<script id="stash-nav-current-page">

})();
</script>
<script id="stash-nav-message-counter">(()=>{const badge=document.getElementById('stashNavMessageCount');if(!badge||!window.supabase)return;const client=window.supabase.createClient('https://hhntssweslmmqskhoaje.supabase.co','sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3');let activeUser=null,channel=null,busy=false;async function refresh(){if(busy)return;busy=true;try{const {data:{session}}=await client.auth.getSession();const uid=session?.user?.id||null;if(!uid){badge.hidden=true;if(channel){client.removeChannel(channel);channel=null}activeUser=null;return}if(activeUser!==uid){if(channel)client.removeChannel(channel);activeUser=uid;channel=client.channel('stash-nav-messages-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'messages'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'message_reads',filter:'user_id=eq.'+uid},refresh).on('postgres_changes',{event:'*',schema:'public',table:'conversation_user_settings',filter:'user_id=eq.'+uid},refresh).on('postgres_changes',{event:'*',schema:'public',table:'conversation_members',filter:'user_id=eq.'+uid},refresh).subscribe()}const {data:members,error:mErr}=await client.from('conversation_members').select('conversation_id').eq('user_id',uid);if(mErr)throw mErr;const ids=[...new Set((members||[]).map(x=>x.conversation_id))];if(!ids.length){badge.hidden=true;return}const [{data:allMembers,error:aErr},{data:msgs,error:m2Err},{data:settings,error:sErr}]=await Promise.all([client.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids),client.from('messages').select('id,conversation_id,sender_id,read_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(300),client.from('conversation_user_settings').select('conversation_id,manual_unread,is_hidden').eq('user_id',uid).in('conversation_id',ids)]);if(aErr||m2Err||sErr)throw aErr||m2Err||sErr;const groupIds=new Set();for(const id of ids){if((allMembers||[]).filter(x=>x.conversation_id===id&&x.user_id!==uid).length>1)groupIds.add(id)}const incoming=(msgs||[]).filter(m=>m.sender_id!==uid),incomingIds=incoming.filter(m=>groupIds.has(m.conversation_id)).map(m=>m.id);let readSet=new Set();if(incomingIds.length){const {data:reads,error:rErr}=await client.from('message_reads').select('message_id').eq('user_id',uid).in('message_id',incomingIds);if(rErr)throw rErr;(reads||[]).forEach(r=>readSet.add(r.message_id))}const settingMap={};(settings||[]).forEach(s=>settingMap[s.conversation_id]=s);const hidden=new Set((settings||[]).filter(s=>s.is_hidden).map(s=>s.conversation_id));const counts={};for(const m of incoming){if(hidden.has(m.conversation_id))continue;const unread=groupIds.has(m.conversation_id)?!readSet.has(m.id):!m.read_at;if(unread)counts[m.conversation_id]=(counts[m.conversation_id]||0)+1}let total=Object.values(counts).reduce((a,b)=>a+b,0);for(const id of ids){const setting=settingMap[id];if(setting?.manual_unread&&!hidden.has(id)&&!counts[id])total++}badge.textContent=total>99?'99+':String(total);badge.hidden=total===0}catch(e){console.warn('STASH message badge:',e.message);badge.hidden=true}finally{busy=false}}client.auth.onAuthStateChange(()=>setTimeout(refresh,0));window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});refresh()})();</script></body></html>
