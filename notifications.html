<style>
:root{color-scheme:dark;--bg:#100e1b;--panel:#1b1830;--muted:#aaa5c0;--pink:#ff5ba7;--orange:#ff9b5b;--line:#39334f}

.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;font-weight:950;font-size:21px;color:#201326}.brand strong{letter-spacing:2px;font-size:19px}

/* STASH — nouvelle direction visuelle glass / noir */

<header class="top"><div class="brand"><img class="stash-brand-image" src="./assets/stash-logo.png" alt="STASH"><strong>STASH</strong></div><button class="back" onclick="location.href='index.html'">← Retour au fil</button></header>
<main>
 <div class="heading"><div><h1>Notifications 🔔</h1><p>Tout ce qui se passe autour de ton compte et de tes publications.</p></div><button class="markall" id="markAll">Tout lire</button></div>
 <div class="list" id="list"><div class="loading">On récupère tes notifications…</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
(()=> {
const URL='https://hhntssweslmmqskhoaje.supabase.co',KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let currentUser=null,items=[];
let notificationChannel=null,notificationChannelUser=null,loading=false;
function startNotificationRealtime(){
 const userId=currentUser?.id||null;
 if(!userId){if(notificationChannel){db.removeChannel(notificationChannel);notificationChannel=null;notificationChannelUser=null}return}
 if(notificationChannel&&notificationChannelUser===userId)return;
 if(notificationChannel)db.removeChannel(notificationChannel);
 notificationChannelUser=userId;
 notificationChannel=db.channel('confess-notifications-page-'+userId)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+userId},()=>{if(!loading)load()})
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:'user_id=eq.'+userId},()=>{if(!loading)load()})
  .subscribe();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ago(v){const sec=Math.max(0,(Date.now()-new Date(v).getTime())/1000);if(sec<60)return "à l'instant";if(sec<3600)return Math.floor(sec/60)+' min';if(sec<86400)return Math.floor(sec/3600)+' h';if(sec<604800)return Math.floor(sec/86400)+' j';return new Date(v).toLocaleDateString('fr-FR')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function message(n,actor){const who=actor?.username||'Quelqu’un';switch(n.kind){
case 'follow':return {icon:'👋',title:who+' a commencé à te suivre',sub:'Découvre son profil'};
case 'message':return {icon:'💬',title:who+' t’a envoyé un message',sub:'Ouvre ta conversation privée'};
case 'reaction':return {icon:'❤️',title:who+' a aimé ta publication',sub:'Une réaction à ta confession'};
case 'reaction_anonymous':return {icon:'❤️',title:'Quelqu’un a aimé ta publication',sub:'La personne a choisi de rester anonyme'};
case 'comment':return {icon:'💬',title:who+' a commenté ta publication',sub:'Une nouvelle réponse à lire'};
case 'comment_anonymous':return {icon:'🎭',title:'Quelqu’un a commenté ta publication',sub:'La personne a répondu anonymement'};
case 'reply':return {icon:'↩️',title:who+' a répondu à ton commentaire',sub:'La discussion continue'};
case 'reply_anonymous':return {icon:'🎭',title:'Quelqu’un a répondu à ton commentaire',sub:'La personne a répondu anonymement'};
case 'comment_reaction':return {icon:'✨',title:who+' a réagi à ton commentaire',sub:'Ton commentaire a reçu une réaction'};
case 'comment_reaction_anonymous':return {icon:'✨',title:'Quelqu’un a réagi à ton commentaire',sub:'La réaction est anonyme'};
case 'profile_comment':return {icon:'📝',title:who+' a laissé un message sur ton profil',sub:'Un nouveau message sur ton mur'};
case 'profile_reply':return {icon:'↩️',title:who+' a répondu à un message sur ton profil',sub:'La discussion continue sur le mur'};
case 'sanction_issued':return {icon:'⚖️',title:'Une décision de modération te concerne',sub:'Consulte le motif et les détails dans tes sanctions'};
case 'appeal_received':return {icon:'📨',title:who+' a déposé un recours',sub:'Une contestation attend ton examen'};
case 'appeal_decision':return {icon:'⚖️',title:'La modération a répondu à ton recours',sub:'Consulte la décision et la réponse de l’équipe'};
default:return {icon:'🔔',title:'Nouvelle notification',sub:'Une activité sur STASH'};
}}
async function load(){if(loading)return;loading=true;const {data:{session}}=await db.auth.getSession();currentUser=session?.user||null;if(!currentUser){startNotificationRealtime();loading=false;$('list').innerHTML='<div class="empty">Connecte-toi pour consulter tes notifications.<br><br><button class="markall" onclick="location.href=\'auth.html\'">Se connecter</button></div>';$('markAll').hidden=true;return}
startNotificationRealtime();
const {data,error}=await db.from('notifications').select('id,user_id,actor_id,kind,post_id,comment_id,profile_id,conversation_id,sanction_id,appeal_id,is_read,created_at').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(100);
if(error){console.error(error);$('list').innerHTML='<div class="empty">Impossible de charger tes notifications.</div>';loading=false;return}
items=data||[];const actorIds=[...new Set(items.map(x=>x.actor_id).filter(Boolean))];let actors={};
if(actorIds.length){const {data:profiles}=await db.from('profiles').select('id,username').in('id',actorIds);(profiles||[]).forEach(p=>actors[p.id]=p)}
if(!items.length){$('list').innerHTML='<div class="empty">Tu es à jour ! ✨<br>Quand quelqu’un interagira avec toi, tu le verras ici.</div>';loading=false;return}
$('list').innerHTML=items.map(n=>{const m=message(n,actors[n.actor_id]);return '<button class="item '+(!n.is_read?'unread':'')+'" data-notif="'+n.id+'"><span class="symbol">'+m.icon+'</span><span class="copy"><strong>'+esc(m.title)+'</strong><p>'+esc(m.sub)+' · '+esc(ago(n.created_at))+'</p></span>'+(!n.is_read?'<span class="dot"></span>':'')+'</button>'}).join('');
$('list').querySelectorAll('[data-notif]').forEach(b=>b.onclick=()=>openNotification(b.dataset.notif));
loading=false;
}
async function openNotification(id){const n=items.find(x=>x.id===id);if(!n)return;if(!n.is_read){const {error}=await db.from('notifications').update({is_read:true}).eq('id',id).eq('user_id',currentUser.id);if(error){toast('Impossible de marquer comme lu.');return}}
if(n.kind==='follow'&&n.actor_id)location.href='member.html?id='+encodeURIComponent(n.actor_id);
else if(n.kind==='message'&&n.conversation_id)location.href='messages.html?conversation='+encodeURIComponent(n.conversation_id);
else if(['sanction_issued','appeal_received','appeal_decision'].includes(n.kind))location.href='appeals.html'+(n.appeal_id?'?appeal='+encodeURIComponent(n.appeal_id):'');
else if(['profile_comment','profile_reply'].includes(n.kind)&&n.profile_id)location.href='member.html?id='+encodeURIComponent(n.profile_id)+'&tab=wall';
else if(n.post_id)location.href='index.html?post='+encodeURIComponent(n.post_id);
else location.href='index.html';
}
$('markAll').onclick=async()=>{if(!currentUser)return;const {error}=await db.from('notifications').update({is_read:true}).eq('user_id',currentUser.id).eq('is_read',false);if(error){toast('Impossible de tout marquer comme lu.');return}toast('Toutes les notifications sont lues.');load()};
load();
})();
</script>

 window.addEventListener('resize',update);
 document.addEventListener('focusin',event=>{
  if(event.target.matches('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))requestAnimationFrame(update);
 });
