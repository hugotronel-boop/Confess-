<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506"><title>STASH — Nouveau message</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script><script src="./mfa-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050506;--muted:#a7a7ad;--pink:#ff6cab;--orange:#ffad72}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -18%,rgba(255,108,171,.12),transparent 42%),#050506;color:#fff;font-family:Poppins,Inter,system-ui,sans-serif;min-height:100dvh;padding-bottom:35px}
button,input{font:inherit}button{cursor:pointer}.top{height:66px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(5,5,6,.9);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.1);padding:0 18px}
.back{position:absolute;left:17px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff20;background:#ffffff09;color:#fff;font-size:20px}
.logo{height:37px;max-width:150px;object-fit:contain}.page{width:min(680px,100%);margin:0 auto;padding:23px 17px}
h1{font-size:24px;letter-spacing:-.7px;margin:0 0 5px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin:0 0 20px}
.search-wrap{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);margin-bottom:15px}
.search-wrap span{font-size:17px;color:#aaa}.search{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px}.search::placeholder{color:#92929a}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid #ffffff17;background:#ffffff07;color:#c9c5ce;padding:9px 13px;border-radius:30px;font-size:11px;font-weight:650}
.tab.active{background:rgba(255,108,171,.16);border-color:rgba(255,108,171,.55);color:#ffd3e5}
.count{font-size:10px;opacity:.7;margin-left:4px}
.section-label{font-size:10px;color:#85858d;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;padding:9px 3px}
.people{display:flex;flex-direction:column;gap:2px}
.person{width:100%;display:flex;align-items:center;gap:12px;padding:11px 8px;border:0;border-radius:13px;background:transparent;color:#fff;text-align:left}
.person:active,.person.selected{background:rgba(255,255,255,.065)}
.avatar{width:47px;height:47px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#ff6cab,#8b6cff);font-size:15px;font-weight:800}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{min-width:0;flex:1}.username{font-size:13px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{font-size:10px;color:#92929a;display:block;margin-top:3px}
.check{width:23px;height:23px;border-radius:50%;border:1.5px solid #77727f;display:grid;place-items:center;color:#140c12;font-size:13px;flex:none}
.person.selected .check{border-color:transparent;background:linear-gradient(135deg,var(--pink),var(--orange));font-weight:900}
.empty,.loading{padding:35px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.selection{position:sticky;bottom:10px;margin-top:15px;padding:13px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(20,18,23,.94);backdrop-filter:blur(20px);box-shadow:0 12px 40px #0008}
.selection-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.selection-top strong{font-size:12px}.selection-top small{font-size:10px;color:var(--muted)}
.selected-chips{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid #ffffff17;background:#ffffff0a;color:#f4eaf0;border-radius:20px;padding:6px 9px;font-size:10px}
.start{width:100%;border:0;border-radius:13px;padding:13px;background:linear-gradient(105deg,var(--pink),var(--orange));color:#1b1016;font-size:12px;font-weight:850;box-shadow:0 8px 24px rgba(255,108,171,.15)}
.start:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
@media(min-width:700px){.page{padding-top:30px}.person{padding:12px 10px}.selection{bottom:16px}}
</style>

<style id="stash-pure-black-background">
html,body{background:#000!important;background-image:none!important}body{background:#000!important;background-image:none!important}body::before,body::after{content:none!important;display:none!important;background:none!important;box-shadow:none!important}
</style>
<style id="stash-new-navigation">
.confess-global-nav{
 position:fixed!important;left:50%!important;bottom:calc(10px + env(safe-area-inset-bottom))!important;
 transform:translateX(-50%)!important;width:min(560px,calc(100% - 28px))!important;
 min-height:58px!important;display:flex!important;align-items:center!important;
 justify-content:space-between!important;gap:4px!important;
 padding:7px 9px!important;
 background:rgba(105,105,105,.42)!important;
 -webkit-backdrop-filter:blur(24px) saturate(170%)!important;
 backdrop-filter:blur(24px) saturate(170%)!important;
 border:1px solid rgba(255,255,255,.2)!important;border-radius:999px!important;
 box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)!important;
 z-index:999!important
}
.confess-global-nav a,.confess-global-nav a[data-nav],
.confess-global-nav a.nav-publish-center,.confess-global-nav a[data-nav="profile"]{
 flex:1 1 0!important;min-width:0!important;min-height:42px!important;height:42px!important;
 margin:0!important;padding:0 5px!important;display:flex!important;align-items:center!important;
 justify-content:center!important;gap:0!important;border:0!important;border-radius:999px!important;
 background:transparent!important;color:rgba(255,255,255,.94)!important;box-shadow:none!important;
 text-decoration:none!important;transform:none!important;font:600 12px/1 Poppins,Inter,system-ui,sans-serif!important;
 white-space:nowrap!important
}
.confess-global-nav a span,.confess-global-nav a[data-nav] span,
.confess-global-nav a[data-nav="profile"] span,.confess-global-nav a.nav-publish-center span{
 display:block!important;color:inherit!important;font:600 12px/1 Poppins,Inter,system-ui,sans-serif!important
}
.confess-global-nav a svg,.confess-global-nav a img,.confess-global-nav a b{display:none!important}
.confess-global-nav a.stash-bubble-active,.confess-global-nav a[aria-current="page"]{
 background:transparent!important;color:#fff!important;
 box-shadow:none!important;border:0!important;font-weight:750!important
}
.confess-global-nav a.stash-bubble-active span,
.confess-global-nav a[aria-current="page"] span{color:#fff!important;font-weight:750!important;opacity:1!important}
@media(min-width:700px){.confess-global-nav{bottom:18px!important}}
</style>
</head>
<body>
<header class="top"><button class="back" id="back" aria-label="Retour">‹</button><img class="logo" src="./assets/stash-logo.png" alt="STASH"></header>
<main class="page">
<h1>Nouveau message</h1><p class="sub">Choisis une ou plusieurs personnes pour démarrer une discussion.</p>
<div class="search-wrap"><span>⌕</span><input class="search" id="search" type="search" placeholder="Rechercher un pseudo…" autocomplete="off"></div>
<div class="tabs" id="tabs">
<button class="tab active" data-tab="followers">Abonnés</button>
<button class="tab" data-tab="following">Abonnements</button>
<button class="tab" data-tab="mutual">Amis en commun</button>
<button class="tab" data-tab="all">Tout le monde</button>
</div>
<div class="section-label" id="sectionLabel">Les personnes qui te suivent</div>
<div class="people" id="people"><div class="loading">Chargement des membres…</div></div>
<div class="selection">
 <div class="selection-top"><strong>Destinataires sélectionnés</strong><small id="selectionCount">0 personne</small></div>
 <div class="selected-chips" id="selectedChips"><span class="hint">Sélectionne au moins une personne.</span></div>
 <button class="start" id="start" disabled>Continuer <span aria-hidden="true">→</span></button>
</div>
</main>
<script>
(()=> {
const URL='https://hhntssweslmmqskhoaje.supabase.co',KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let me=null,profiles=[],followers=new Set(),following=new Set(),selected=new Set(),tab='followers',busy=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatar(p){const url=p.avatar_path?db.storage.from('confess-avatars').getPublicUrl(p.avatar_path).data.publicUrl:null;return '<span class="avatar">'+(url?'<img src="'+esc(url)+'" alt="">':esc((p.username||'?')[0].toUpperCase()))+'</span>'}
function tabRows(){
 if(tab==='followers')return profiles.filter(p=>followers.has(p.id));
 if(tab==='following')return profiles.filter(p=>following.has(p.id));
 if(tab==='mutual')return profiles.filter(p=>followers.has(p.id)&&following.has(p.id));
 return profiles;
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const rows=tabRows().filter(p=>p.username.toLowerCase().includes(q));
 const labels={followers:'Les personnes qui te suivent',following:'Les personnes que tu suis',mutual:'Vous vous suivez mutuellement',all:'Tous les membres STASH'};
 $('sectionLabel').textContent=labels[tab]+(q?' · recherche':'');
 $('people').innerHTML=rows.length?rows.map(p=>'<button class="person '+(selected.has(p.id)?'selected':'')+'" data-user="'+p.id+'">'+avatar(p)+'<span class="person-info"><span class="username">'+esc(p.username)+'</span><span class="hint">'+(followers.has(p.id)&&following.has(p.id)?'Vous vous suivez mutuellement':following.has(p.id)?'Tu suis cette personne':followers.has(p.id)?'Cette personne te suit':'Membre STASH')+'</span></span><span class="check">'+(selected.has(p.id)?'✓':'')+'</span></button>').join(''):'<div class="empty">'+(q?'Aucun membre ne correspond à ta recherche.':'Aucune personne dans cette liste pour le moment.')+'</div>';
 $('people').querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>toggle(b.dataset.user));
 $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 $('tabs').querySelector('[data-tab="followers"]').innerHTML='Abonnés <span class="count">'+followers.size+'</span>';
 $('tabs').querySelector('[data-tab="following"]').innerHTML='Abonnements <span class="count">'+following.size+'</span>';
 $('tabs').querySelector('[data-tab="mutual"]').innerHTML='Amis en commun <span class="count">'+[...followers].filter(id=>following.has(id)).length+'</span>';
 renderSelection();
}
function toggle(id){if(selected.has(id))selected.delete(id);else{if(selected.size>=19){alert('Tu peux sélectionner jusqu’à 19 personnes.');return}selected.add(id)}render()}
function renderSelection(){
 const chosen=profiles.filter(p=>selected.has(p.id));
 $('selectionCount').textContent=chosen.length+' personne'+(chosen.length>1?'s':'');
 $('selectedChips').innerHTML=chosen.length?chosen.map(p=>'<button class="chip" data-remove="'+p.id+'">× '+esc(p.username)+'</button>').join(''):'<span class="hint">Sélectionne au moins une personne.</span>';
 $('selectedChips').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);render()});
 $('start').disabled=!chosen.length||busy;
}
async function startConversation(){
 if(!selected.size||busy)return;busy=true;$('start').textContent='Préparation…';$('start').disabled=true;
 const ids=[...selected];let result;
 if(ids.length===1){
  result=await db.rpc('create_direct_conversation',{p_recipient_id:ids[0]});
 }else{
  const names=profiles.filter(p=>selected.has(p.id)).map(p=>p.username);
  let title=names.slice(0,3).join(', ')+(names.length>3?' + '+(names.length-3):'');
  if(title.length>60)title=title.slice(0,57)+'…';
  result=await db.rpc('create_group_conversation',{p_title:title,p_member_ids:ids});
 }
 if(result.error){alert(result.error.message||'Impossible de créer la discussion.');busy=false;$('start').textContent='Continuer →';renderSelection();return}
 location.href='messages.html?conversation='+encodeURIComponent(result.data);
}
$('start').onclick=startConversation;
$('search').addEventListener('input',render);
$('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$('back').onclick=()=>location.href='messages.html';
async function init(){
 const {data:{session}}=await db.auth.getSession();me=session?.user||null;
 if(!me){location.href='auth.html';return}
 const [f,r,p]=await Promise.all([
  db.from('user_follows').select('follower_id').eq('followed_id',me.id),
  db.from('user_follows').select('followed_id').eq('follower_id',me.id),
  db.from('profiles').select('id,username,avatar_path').neq('id',me.id).order('username').limit(500)
 ]);
 if(f.error||r.error||p.error){$('people').innerHTML='<div class="empty">Impossible de charger les membres. Réessaie dans un instant.</div>';console.error(f.error||r.error||p.error);return}
 (f.data||[]).forEach(x=>followers.add(x.follower_id));
 (r.data||[]).forEach(x=>following.add(x.followed_id));
 profiles=p.data||[];
 render();
}
init();
})();
</script>
<nav class="bottomnav confess-global-nav" aria-label="Navigation principale">
<a href="./index.html" data-nav="home"><span>Feed</span></a>
<a href="./messages.html" data-nav="messages"><span>Message</span></a>
<a href="./publish.html" data-nav="publish"><span>+</span></a>
<a href="./notifications.html" data-nav="notifications"><span>Actus</span></a>
<a href="./profile.html" data-nav="profile"><span>Profil</span></a>
</nav>
<script id="stash-nav-current-page">
(()=>{const nav=document.querySelector('.confess-global-nav');if(!nav)return;
const file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
const map={'index.html':'home','messages.html':'messages','publish.html':'publish','notifications.html':'notifications','explore.html':'home','profile.html':'profile','settings.html':'profile','member.html':'profile','admin.html':'profile','moderation.html':'profile','appeals.html':'profile','sanctions.html':'profile'};
const current=map[file]||'home';
nav.querySelectorAll('a[data-nav]').forEach(a=>{const active=a.dataset.nav===current;a.classList.toggle('stash-nav-current',active);a.classList.toggle('stash-bubble-active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
})();
</script>
</body></html>
