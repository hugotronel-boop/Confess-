<style>
:root{color-scheme:dark;--bg:#100e1b;--panel:#1b1830;--panel2:#24203b;--muted:#aaa5c0;--pink:#ff5ba7;--orange:#ff9b5b;--line:#39334f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#38204b 0,transparent 28%),var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
button,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#100e1bed;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:12px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;font-weight:950;font-size:21px;color:#201326}.brand strong{letter-spacing:2px;font-size:19px}

.shell{height:min(720px,calc(100vh - 150px));min-height:480px;display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--panel);border:1px solid #ffffff15;border-radius:22px;overflow:hidden}
.inbox{border-right:1px solid #ffffff13;min-width:0;display:flex;flex-direction:column}.inbox-head{padding:16px;border-bottom:1px solid #ffffff13;display:flex;justify-content:space-between;align-items:center}.inbox-head strong{font-size:14px}.inbox-actions{display:flex;gap:6px}.group-create{border:0;background:linear-gradient(110deg,var(--pink),var(--orange));color:#241326;border-radius:20px;padding:9px 11px;font-size:11px;font-weight:900}.group-overlay{position:fixed;inset:0;background:#080611c9;z-index:30;display:grid;place-items:center;padding:16px}.group-overlay[hidden]{display:none}.group-dialog{width:min(480px,100%);max-height:90dvh;overflow:auto;background:#1b1830;border:1px solid #ffffff20;border-radius:22px;padding:18px}.group-field{width:100%;background:#100e1b;border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff;margin:0 0 10px}.group-members{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto;margin:10px 0}.group-person{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#ffffff08;font-size:13px}.group-person input{accent-color:var(--pink)}.group-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.group-footer button{border-radius:20px;padding:10px 14px;font-size:12px}.group-cancel{background:transparent;border:1px solid var(--line);color:#fff}.group-submit{background:linear-gradient(110deg,var(--pink),var(--orange));border:0;color:#241326;font-weight:900}.inbox-list{overflow:auto;padding:8px}
.thread{width:100%;border:0;background:transparent;color:white;display:flex;gap:11px;align-items:center;padding:12px;border-radius:14px;text-align:left}.thread:hover,.thread.active{background:#ffffff10}.avatar{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,#ff5ba7,#8f6bff);display:grid;place-items:center;font-weight:850;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.thread-copy{min-width:0;flex:1}.thread-top{display:flex;justify-content:space-between;gap:7px}.thread-top strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thread-top small{font-size:10px;color:var(--muted);white-space:nowrap}.preview{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}.unread-count{background:var(--pink);color:#241326;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:20px;display:grid;place-items:center;padding:0 5px;margin-top:5px}
.chat{min-width:0;display:flex;flex-direction:column;position:relative}.chat-head{padding:13px 17px;border-bottom:1px solid #ffffff13;display:flex;align-items:center;gap:11px;min-height:69px}.chat-head .avatar{width:39px;height:39px}.chat-head strong{font-size:13px}.chat-head small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.chat-scroll{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:min(78%,520px);padding:11px 13px;border-radius:16px;background:#302a45;color:#f7f2ff;align-self:flex-start;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:linear-gradient(120deg,#a83d7e,#7b4b91);color:white;border-bottom-right-radius:5px}.bubble:not(.mine){border-bottom-left-radius:5px}.bubble time{display:block;font-size:9px;opacity:.7;text-align:right;margin-top:5px}.composer{display:flex;align-items:flex-end;gap:9px;padding:13px;border-top:1px solid #ffffff13;background:#171329}.composer textarea{flex:1;min-height:43px;max-height:120px;resize:vertical;background:#100e1b;border:1px solid var(--line);border-radius:14px;padding:12px;color:white;outline:none;font-size:13px}.composer textarea:focus{border-color:var(--pink)}.send{border:0;border-radius:13px;background:linear-gradient(100deg,var(--pink),var(--orange));color:#241326;font-weight:900;padding:13px 16px}.send:disabled{opacity:.5}.placeholder,.loading,.empty{padding:35px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}.placeholder{margin:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#302744;border:1px solid #ffffff22;color:#fff;padding:12px 16px;border-radius:13px;font-size:12px;z-index:20;display:none;max-width:90%;text-align:center}.toast.show{display:block}.mobile-back{display:none;border:0;background:transparent;color:#ff9bc9;font-size:18px;padding:6px}
@media(max-width:700px){main{margin:15px auto;padding:0 9px}.heading{padding:0 5px}.shell{height:calc(100dvh - 128px);min-height:420px;border-radius:17px;grid-template-columns:1fr}.inbox{border-right:0}.chat{display:none}.shell.chat-open .inbox{display:none}.shell.chat-open .chat{display:flex}.mobile-back{display:block}.bubble{max-width:86%}.chat-scroll{padding:13px}.composer{padding:10px}}

.confess-bell{position:relative;border:1px solid var(--line,#39334f);background:var(--panel,#1b1830);color:#fff;border-radius:30px;padding:9px 12px;font-size:16px;cursor:pointer;margin-left:8px}.confess-bell-count{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:20px;background:#ff5ba7;color:#241326;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px}.confess-bell-count[hidden]{display:none}

/* STASH — nouvelle direction visuelle glass / noir */
:root{color-scheme:dark;--bg:#050506;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.085);--muted:#a7a7ad;--pink:#ff6cab;--orange:#ffad72;--line:rgba(255,255,255,.16);--white:#fff}
html{background:#050506}
body{background:radial-gradient(ellipse at 50% -18%,rgba(255,108,171,.13),transparent 42%),radial-gradient(ellipse at 100% 35%,rgba(255,173,114,.08),transparent 34%),#050506!important;color:#fff;font-family:'Poppins',Inter,system-ui,-apple-system,sans-serif!important;position:relative;isolation:isolate}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;width:clamp(150px,25vw,300px);height:clamp(150px,25vw,300px);right:clamp(-85px,5vw,90px);top:clamp(75px,15vh,170px);border:1px solid rgba(255,255,255,.22);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.015) 55%,rgba(255,108,171,.06));box-shadow:inset 0 0 45px rgba(255,255,255,.045),0 0 90px rgba(255,108,171,.08);backdrop-filter:blur(2px);transform:perspective(700px) rotateX(57deg) rotateZ(45deg);opacity:.48}
body:after{content:"";position:fixed;z-index:-1;pointer-events:none;width:clamp(110px,18vw,210px);height:clamp(110px,18vw,210px);right:clamp(-30px,12vw,180px);top:clamp(120px,22vh,240px);border:1px solid rgba(255,255,255,.12);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 70%);transform:perspective(700px) rotateX(57deg) rotateZ(45deg) translateZ(55px);opacity:.3}
.top{background:rgba(5,5,6,.76)!important;border-bottom:1px solid rgba(255,255,255,.12)!important;backdrop-filter:blur(22px)!important}
.brand strong,.logo{font-family:'Poppins',sans-serif!important;letter-spacing:.12em!important}
.mark{background:linear-gradient(135deg,var(--pink),var(--orange))!important;box-shadow:0 0 24px rgba(255,108,171,.2)}
main{position:relative;z-index:1}
:is(.hero,.welcome,.composer,.post,.sidebox,.rightside,.leftside,.panel,.card,.shell,.inbox,.chat,.modal,.item,.member,.search,.empty,.loading,.follow-dialog,.follow-dialog-head,.follow-list,.bottomnav){background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025))!important;border-color:rgba(255,255,255,.14)!important;box-shadow:0 16px 55px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.045)}
:is(.hero,.welcome){background:linear-gradient(125deg,rgba(255,108,171,.13),rgba(255,173,114,.055) 55%,rgba(255,255,255,.035))!important}
:is(.composer,.post,.card,.modal,.shell,.item,.member,.follow-dialog){backdrop-filter:blur(18px)}
:is(input,textarea,select,.field,.composer textarea,.search input){background:rgba(0,0,0,.42)!important;border-color:rgba(255,255,255,.18)!important;color:#fff!important}
:is(input,textarea,select,.field):focus{border-color:rgba(255,108,171,.75)!important;box-shadow:0 0 0 3px rgba(255,108,171,.09)}
:is(button,.back,.action,.tab,.open,.msgbtn,.bell,.confess-bell,.markall,.follow,.follow-person-action,.close){font-family:'Poppins',sans-serif!important;border-color:rgba(255,255,255,.19)!important}

:is(.back,.action,.tab,.open,.msgbtn,.bell,.confess-bell,.markall,.follow,.follow-person-action,.close,.secondary){background:rgba(255,255,255,.055)!important;color:#f7f4f5!important}

:is(.bubble.mine){background:linear-gradient(120deg,#d9579a,#b47b9f)!important;color:#fff!important}

:is(.toast){backdrop-filter:blur(18px)}
@media(max-width:640px){body:before{right:-85px;top:115px;opacity:.35}body:after{right:-25px;top:165px;opacity:.22}}



/* Messagerie STASH — interface inspirée de Threads */
.messages-top{height:66px;padding:8px max(18px,calc((100vw - 760px)/2))!important;background:rgba(5,5,6,.94)!important}
.messages-top h1{margin:0;font-size:25px;font-weight:850;letter-spacing:-.7px;color:#fff}
.messages-top .confess-bell{margin-left:auto}
main{width:min(760px,100%)!important;margin:0 auto!important;padding:0 0 18px!important}
.shell{height:calc(100dvh - 150px)!important;min-height:480px!important;grid-template-columns:1fr!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.inbox{border:0!important;background:transparent!important}
.inbox-head{padding:14px 16px!important;border-bottom:1px solid rgba(255,255,255,.12)!important;gap:10px}
.inbox-search{flex:1;min-width:0;height:40px;border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(255,255,255,.07);padding:0 13px;color:#fff;font-size:13px;outline:none}
.inbox-search::placeholder{color:#92929a}
.inbox-search:focus{border-color:rgba(255,108,171,.65)}
.inbox-actions{flex:none}
.inbox-actions .action,.inbox-actions .group-create{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:0}
.inbox-actions .action:after{content:"＋";font-size:22px;line-height:1}
.inbox-actions .group-create{font-size:0}
.inbox-actions .group-create:after{content:"👥";font-size:16px}
.inbox-list{padding:4px 0 20px!important}
.thread{border-radius:0!important;padding:13px 17px!important;border-bottom:1px solid rgba(255,255,255,.075)!important;gap:12px}
.thread:hover,.thread.active{background:rgba(255,255,255,.055)!important}
.thread .avatar,.chat-head .avatar{width:49px!important;height:49px!important;border-radius:50%!important}
.thread-top strong{font-size:14px!important;font-weight:750}
.thread-top small{font-size:11px!important}
.preview{font-size:12px!important;margin-top:5px!important}
.chat{background:#050506!important}
.chat-head{background:rgba(5,5,6,.96)!important}
@media(max-width:700px){
 main{margin:0 auto!important;padding:0 0 12px!important}
 .messages-top{height:64px;padding:8px 17px!important}
 .shell{height:calc(100dvh - 142px)!important;min-height:400px!important}
 .inbox-head{padding:12px 14px!important}
 .thread{padding:13px 15px!important}
 .thread .avatar{width:48px!important;height:48px!important}
}

/* Navigation principale persistante sur toutes les pages STASH */
.confess-global-nav{display:flex!important;position:fixed!important;left:50%!important;bottom:0!important;transform:translateX(-50%)!important;width:min(760px,100%)!important;z-index:999!important;justify-content:space-around!important;align-items:center!important;gap:4px!important;padding:9px 10px calc(9px + env(safe-area-inset-bottom))!important;border:1px solid rgba(255,255,255,.14)!important;border-bottom:0!important;border-radius:18px 18px 0 0!important;background:rgba(5,5,6,.92)!important;backdrop-filter:blur(22px)!important;box-shadow:0 -8px 35px rgba(0,0,0,.25)!important}

.confess-global-nav a[aria-current="page"]{color:#ff9fc7!important;background:rgba(255,108,171,.12)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}
@media(max-width:420px){.confess-global-nav{gap:0!important;padding-left:4px!important;padding-right:4px!important}.confess-global-nav a{font-size:9px!important}.confess-global-nav a b{font-size:18px}}

<body>
<header class="top messages-top"><h1>MESSAGES</h1><button class="confess-bell" id="confessBell" aria-label="Notifications">🔔<span class="confess-bell-count" id="confessBellCount" hidden>0</span></button></header>
<main>
<section class="shell" id="shell">
 <aside class="inbox"><div class="inbox-head"><input class="inbox-search" id="inboxSearch" type="search" maxlength="60" placeholder="Rechercher"><div class="inbox-actions"><button class="action" onclick="location.href='index.html'">+ Privé</button><button class="group-create" id="openGroup">+ Groupe</button></div></div><div class="inbox-list" id="inboxList"><div class="loading">Chargement des conversations…</div></div></aside>
 <section class="chat"><div class="chat-head" id="chatHead"><button class="mobile-back" id="backInbox">←</button><div class="placeholder">Choisis une conversation pour commencer.</div></div><div class="chat-scroll" id="chatScroll"><div class="placeholder">Tes échanges privés apparaîtront ici ✨</div></div><div class="composer"><textarea id="messageBody" maxlength="5000" placeholder="Écris ton message…" disabled></textarea><button class="send" id="sendBtn" disabled>Envoyer ↗</button></div></section>
</section></main><div class="toast" id="toast"></div><div class="group-overlay" id="groupOverlay" hidden><section class="group-dialog" role="dialog" aria-modal="true"><h2>Créer une discussion de groupe 👥</h2><p>Choisis un nom et invite entre 2 et 19 personnes.</p><input class="group-field" id="groupName" maxlength="60" placeholder="Nom du groupe"><input class="group-field" id="groupSearch" maxlength="50" placeholder="Rechercher un membre…"><div class="group-members" id="groupMembers"></div><div id="groupSelectionCount">0 membre sélectionné</div><div class="group-footer"><button class="group-cancel" id="cancelGroup">Annuler</button><button class="group-submit" id="createGroup" disabled>Créer le groupe</button></div></section></div>
<script>
(()=> {
const URL='https://hhntssweslmmqskhoaje.supabase.co',KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let me=null,threads=[],activeId=null,activePeer=null,realtime=null,loadingMessages=false,groupDirectory=[],selectedGroupMembers=new Set(),typingTimer=null,isTyping=false,activeMessageIds=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function ago(v){const d=Math.max(0,Date.now()-new Date(v).getTime());if(d<60000)return "à l'instant";if(d<3600000)return Math.floor(d/60000)+' min';if(d<86400000)return Math.floor(d/3600000)+' h';if(d<604800000)return Math.floor(d/86400000)+' j';return new Date(v).toLocaleDateString('fr-FR')}
function avatar(p){if(p?.group)return '<span class="avatar">👥</span>';return p?.avatar_path?'<span class="avatar"><img src="'+esc(db.storage.from('confess-avatars').getPublicUrl(p.avatar_path).data.publicUrl)+'" alt=""></span>':'<span class="avatar">'+esc((p?.username||'?')[0].toUpperCase())+'</span>'}
async function openGroupModal(){
 $('groupOverlay').hidden=false;$('groupName').value='';$('groupSearch').value='';selectedGroupMembers.clear();$('groupMembers').innerHTML='<div class="loading">Chargement des membres…</div>';
 const {data,error}=await db.from('profiles').select('id,username').neq('id',me.id).order('username').limit(100);
 if(error){$('groupMembers').innerHTML='<div class="empty">Impossible de charger les membres.</div>';toast(error.message);return}
 groupDirectory=data||[];renderGroupDirectory();updateGroupSelection();
}
function renderGroupDirectory(){
 const q=$('groupSearch').value.trim().toLowerCase();const rows=groupDirectory.filter(p=>p.username.toLowerCase().includes(q));
 $('groupMembers').innerHTML=rows.length?rows.map(p=>'<label class="group-person"><input type="checkbox" data-group-user="'+p.id+'" '+(selectedGroupMembers.has(p.id)?'checked':'')+'><span>'+esc(p.username)+'</span></label>').join(''):'<div class="empty">Aucun membre trouvé.</div>';
 $('groupMembers').querySelectorAll('[data-group-user]').forEach(input=>input.onchange=()=>{if(input.checked){if(selectedGroupMembers.size>=19){input.checked=false;toast('Maximum 19 personnes invitées.');return}selectedGroupMembers.add(input.dataset.groupUser)}else selectedGroupMembers.delete(input.dataset.groupUser);updateGroupSelection()});
}
function updateGroupSelection(){$('groupSelectionCount').textContent=selectedGroupMembers.size+' membre'+(selectedGroupMembers.size>1?'s':'')+' sélectionné'+(selectedGroupMembers.size>1?'s':'');$('createGroup').disabled=selectedGroupMembers.size<2||$('groupName').value.trim().length<2}
async function createGroup(){
 const title=$('groupName').value.trim();if(title.length<2||selectedGroupMembers.size<2)return;
 const btn=$('createGroup');btn.disabled=true;btn.textContent='Création…';
 const {data,error}=await db.rpc('create_group_conversation',{p_title:title,p_member_ids:[...selectedGroupMembers]});
 btn.textContent='Créer le groupe';
 if(error){toast(error.message||'Création impossible.');updateGroupSelection();return}
 $('groupOverlay').hidden=true;await loadThreads();await openConversation(data);toast('Groupe créé ! 👥');
}
$('openGroup').onclick=openGroupModal;$('cancelGroup').onclick=()=>$('groupOverlay').hidden=true;
$('groupOverlay').addEventListener('click',e=>{if(e.target===$('groupOverlay'))$('groupOverlay').hidden=true});
$('groupSearch').addEventListener('input',renderGroupDirectory);$('groupName').addEventListener('input',updateGroupSelection);$('createGroup').onclick=createGroup;
async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(!me){$('openGroup').hidden=true;$('inboxList').innerHTML='<div class="empty">Connecte-toi pour accéder à tes messages.<br><br><button class="action" onclick="location.href=\'auth.html\'">Se connecter</button></div>';return}
await loadThreads();const target=new URLSearchParams(location.search).get('conversation');if(target)await openConversation(target)}
async function loadThreads(){const {data:members,error}=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(error){$('inboxList').innerHTML='<div class="empty">Impossible de charger les conversations.</div>';console.error(error);return}
const ids=[...new Set((members||[]).map(x=>x.conversation_id))];if(!ids.length){threads=[];$('inboxList').innerHTML='<div class="empty">Pas encore de conversation.<br>Rends-toi sur le profil d\'un membre pour lui écrire.</div>';return}
const [{data:allMembers},{data:allMessages},{data:conversationRows}]=await Promise.all([
db.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids),
db.from('messages').select('id,conversation_id,sender_id,body,created_at,read_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(300),
db.from('conversations').select('id,title').in('id',ids)
]);
const messageIds=(allMessages||[]).map(m=>m.id);let readSet=new Set();
if(messageIds.length){const {data:reads}=await db.from('message_reads').select('message_id').eq('user_id',me.id).in('message_id',messageIds);(reads||[]).forEach(r=>readSet.add(r.message_id))}
const memberIds=[...new Set((allMembers||[]).map(x=>x.user_id))];let profiles={};
if(memberIds.length){const {data}=await db.from('profiles').select('id,username,avatar_path').in('id',memberIds);(data||[]).forEach(p=>profiles[p.id]=p)}
const titles={};(conversationRows||[]).forEach(c=>titles[c.id]=c.title);
threads=ids.map(id=>{const people=(allMembers||[]).filter(x=>x.conversation_id===id&&x.user_id!==me.id);const msgs=(allMessages||[]).filter(m=>m.conversation_id===id);const last=msgs[0];const isGroup=people.length>1;const unread=msgs.filter(m=>m.sender_id!==me.id&&(isGroup?!readSet.has(m.id):!m.read_at)).length;const names=people.map(x=>profiles[x.user_id]?.username||'Membre');const peer=isGroup?{username:titles[id]||names.join(', '),group:true,memberCount:people.length+1}:{...(profiles[people[0]?.user_id]||{username:'Membre'}),group:false};return {id,peerId:people[0]?.user_id,peer,isGroup,memberCount:people.length+1,last,unread}}).sort((a,b)=>new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0));
$('inboxList').innerHTML=threads.map(t=>`<button class="thread ${t.id===activeId?'active':''}" data-thread="${t.id}">${avatar(t.peer)}<span class="thread-copy"><span class="thread-top"><strong>${esc(t.peer.username)}</strong><small>${esc(t.last?ago(t.last.created_at):'')}</small></span><span class="preview">${t.last?(t.last.sender_id===me.id?'Toi : ':'')+esc(t.last.body):'Nouvelle conversation'}</span></span>${t.unread?'<span class="unread-count">'+t.unread+'</span>':''}</button>`).join('');
$('inboxList').querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>openConversation(b.dataset.thread));
applyThreadSearch();
}
async function openConversation(id){
 if(!threads.some(t=>t.id===id)){
  const {data:membership}=await db.from('conversation_members').select('user_id').eq('conversation_id',id).eq('user_id',me.id).maybeSingle();
  if(!membership){toast('Cette conversation est introuvable.');return}
  await loadThreads();
 }
 const t=threads.find(x=>x.id===id);if(!t)return;
 activeId=id;activePeer=t.peer;$('shell').classList.add('chat-open');
 $('chatHead').innerHTML='<button class="mobile-back" id="backInbox">←</button>'+avatar(t.peer)+'<div><strong>'+esc(t.peer.username)+'</strong><small id="typingStatus">'+(t.isGroup?'Groupe · '+t.memberCount+' membres':'Conversation privée')+'</small></div>';
 $('backInbox').onclick=()=>$('shell').classList.remove('chat-open');
 $('messageBody').disabled=false;$('sendBtn').disabled=false;
 await loadMessages();await db.rpc('mark_conversation_read',{p_conversation_id:id});await loadThreads();subscribe(id);
}

async function loadMessages(){
 if(!activeId||loadingMessages)return;
 loadingMessages=true;
 const {data,error}=await db.from('messages').select('id,conversation_id,sender_id,body,created_at,read_at').eq('conversation_id',activeId).order('created_at',{ascending:false}).limit(200);
 loadingMessages=false;
 if(error){toast('Impossible de charger les messages.');console.error(error);return}
 const rows=(data||[]).reverse();activeMessageIds=rows.map(m=>m.id);
 let senders={},readCounts={};
 if(activePeer&&activePeer.group&&rows.length){
  const ids=[...new Set(rows.map(m=>m.sender_id).filter(id=>id&&id!==me.id))];
  if(ids.length){const {data:people}=await db.from('profiles').select('id,username').in('id',ids);(people||[]).forEach(p=>senders[p.id]=p.username)}
  const {data:reads,error:readError}=await db.from('message_reads').select('message_id,user_id').in('message_id',activeMessageIds);
  if(!readError)(reads||[]).forEach(r=>{readCounts[r.message_id]=(readCounts[r.message_id]||0)+1});
 }
 const totalReaders=Math.max(1,(activePeer?.memberCount||2)-1);
 $('chatScroll').innerHTML=rows.length?rows.map(m=>{
  const mine=m.sender_id===me.id;
  const receipt=mine?(activePeer?.group?(readCounts[m.id]?' · Lu par '+readCounts[m.id]+'/'+totalReaders:''):(m.read_at?' · Lu':'')):'';
  const sender=activePeer&&activePeer.group&&!mine?'<strong style="display:block;font-size:10px;color:#ffb6d7;margin-bottom:4px">'+esc(m.sender_id?(senders[m.sender_id]||'Membre'):'Compte supprimé')+'</strong>':'';
  return '<div class="bubble '+(mine?'mine':'')+'">'+sender+esc(m.body)+'<time>'+new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+receipt+'</time></div>';
 }).join(''):'<div class="placeholder">Début de votre conversation. Dis bonjour 👋</div>';
 $('chatScroll').scrollTop=$('chatScroll').scrollHeight;
}

function applyThreadSearch(){
 const q=($('inboxSearch')?.value||'').trim().toLowerCase();
 $('inboxList').querySelectorAll('[data-thread]').forEach(row=>{
  row.hidden=!!q&&!row.textContent.toLowerCase().includes(q);
 });
}
$('inboxSearch').addEventListener('input',applyThreadSearch);

function renderTyping(){
 const status=$('typingStatus');if(!status||!realtime)return;
 const people=Object.values(realtime.presenceState()||{}).flat().filter(p=>p.user_id!==me.id&&p.typing);
 status.textContent=people.length?(activePeer?.group?'Un membre est en train d’écrire…':'Est en train d’écrire…'):(activePeer?.group?'Groupe · '+(threads.find(t=>t.id===activeId)?.memberCount||'')+' membres':'Conversation privée');
}
async function setTyping(value){
 if(!realtime||isTyping===value)return;
 isTyping=value;
 try{await realtime.track({user_id:me.id,typing:value})}catch(err){console.warn('Typing presence:',err)}
}
function subscribe(id){
 if(realtime){db.removeChannel(realtime);realtime=null}
 clearTimeout(typingTimer);isTyping=false;
 realtime=db.channel('confess-dm:'+id,{config:{private:true,presence:{key:me.id}}})
  .on('presence',{event:'sync'},renderTyping)
  .on('presence',{event:'join'},renderTyping)
  .on('presence',{event:'leave'},renderTyping)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},async payload=>{
   await loadMessages();
   if(payload.new.sender_id!==me.id)await db.rpc('mark_conversation_read',{p_conversation_id:id});
   await loadThreads();
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},async()=>{await loadMessages();await loadThreads()})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'message_reads'},async payload=>{
   if(activeMessageIds.includes(payload.new.message_id))await loadMessages();
  })
  .subscribe(async status=>{
   if(status==='SUBSCRIBED'){try{await realtime.track({user_id:me.id,typing:false})}catch(err){console.warn(err)}}
   else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('STASH Realtime:',status);
  });
 renderTyping();
}

async function send(){
 if(!activeId)return;const body=$('messageBody').value.trim();if(!body)return;
 clearTimeout(typingTimer);await setTyping(false);
 const btn=$('sendBtn');btn.disabled=true;
 const {error}=await db.rpc('send_direct_message',{p_conversation_id:activeId,p_body:body});
 btn.disabled=false;
 if(error){toast(error.message||'Envoi impossible.');return}
 $('messageBody').value='';await loadMessages();await loadThreads();
}
$('sendBtn').onclick=send;
$('messageBody').addEventListener('input',()=>{
 clearTimeout(typingTimer);
 if(!$('messageBody').value.trim()){setTyping(false);return}
 setTyping(true);typingTimer=setTimeout(()=>setTyping(false),1600);
});
$('messageBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeId){loadMessages();db.rpc('mark_conversation_read',{p_conversation_id:activeId})}});
window.addEventListener('beforeunload',()=>{clearTimeout(typingTimer);if(realtime){realtime.untrack();db.removeChannel(realtime)}});
init();
})();
</script><script>
(()=> {
 if(!window.supabase?.createClient)return;
 const client=window.supabase.createClient('https://hhntssweslmmqskhoaje.supabase.co','sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3');
 const badge=document.getElementById('confessBellCount');
 let channel=null,userId=null;
 async function countUnread(){
  const {data:{session}}=await client.auth.getSession();
  const id=session?.user?.id||null;
  if(!id){badge.hidden=true;return}
  const {count,error}=await client.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',id).eq('is_read',false);
  if(error){console.warn('STASH notifications:',error.message);return}
  badge.textContent=(count||0)>99?'99+':String(count||0);
  badge.hidden=!count;
 }
 async function connect(id){
  if(id===userId&&channel)return;
  if(channel){await client.removeChannel(channel);channel=null}
  userId=id;
  if(!id){badge.hidden=true;return}
  channel=client.channel('confess-page-notifications-'+id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .subscribe();
  countUnread();
 }
 async function init(){const {data:{session}}=await client.auth.getSession();await connect(session?.user?.id||null)}
 document.getElementById('confessBell').addEventListener('click',()=>location.href='notifications.html');
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){connect(null);return}
  if(session?.user?.id)setTimeout(()=>connect(session.user.id),0);
 });
 init();
 window.addEventListener('beforeunload',()=>{if(channel)client.removeChannel(channel)});
})();
</script>
