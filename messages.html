<style>
:root{color-scheme:dark;--bg:#000;--panel:#101010;--panel2:#171717;--line:#252525;--muted:#858585;--text:#f5f5f5;--accent:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,sans-serif}
body{padding-bottom:100px}
button,input,textarea{font:inherit}
button{cursor:pointer}
.messages-header{height:76px;position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;background:#000}
.messages-header h1{font-size:19px;font-weight:700;letter-spacing:-.5px;margin:0;justify-self:start}
.messages-logo{width:48px;height:48px;object-fit:contain;justify-self:center}
.messages-compose-link{justify-self:end;width:40px;height:40px;display:grid;place-items:center;color:#fff;text-decoration:none;border:1px solid #303030;border-radius:50%;background:#111;transition:background .2s}
.messages-compose-link:active{background:#292929}
.messages-compose-link svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{width:min(920px,100%);margin:0 auto;padding:18px 18px 30px}
.shell{min-height:calc(100dvh - 210px);display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);background:#080808;border:0;border-radius:18px;overflow:hidden}
.inbox{min-width:0;border-right:0;display:flex;flex-direction:column;background:#080808}
.inbox-head{padding:17px 16px 13px;border-bottom:0}
.inbox-search{width:100%;height:42px;padding:0 14px;border-radius:11px;border:1px solid #2b2b2b;background:#131313;color:#fff;outline:none;font-size:16px!important;line-height:1.3;-webkit-text-size-adjust:100%}
.inbox-search:focus{border-color:#777}.inbox-head-row{display:flex;gap:9px;align-items:center}.inbox-head-row .inbox-search{min-width:0;flex:1}.open-group{width:42px;height:42px;flex:none;border:1px solid #2b2b2b;border-radius:11px;background:#141414;color:#fff;font-size:19px}
.inbox-list{overflow:auto;min-height:0;padding:5px 0 18px}
.thread{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 15px;min-height:76px;border:0;background:transparent;color:#fff}
.thread:hover,.thread.active{background:#151515}
.thread[hidden]{display:none!important}
.search-empty{padding:22px 16px;color:#888;font-size:13px;text-align:center}
.avatar{width:48px;height:48px;min-width:48px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#242424;color:#fff;font-weight:700;border:1px solid #333}
.avatar img{width:100%;height:100%;object-fit:cover}
.thread-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.thread-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.thread-top strong{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-top small{font-size:10px;color:#777;white-space:nowrap}
.preview{font-size:11px;color:#929292;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-count{min-width:19px;height:19px;padding:0 5px;border-radius:20px;background:#fff;color:#000;font-size:10px;font-weight:800;display:grid;place-items:center}
.demo-avatar{background:#252525}
.demo-thread{background:#111}
.demo-online{width:7px;height:7px;border-radius:50%;background:#75d69a;flex:none}
.chat{min-width:0;display:flex;flex-direction:column;background:#050505}
.chat-head{min-height:66px;padding:11px 16px;display:flex;align-items:center;gap:11px;border-bottom:0;background:#080808}
.chat-head>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.chat-head strong{font-size:13px}
.chat-head small{font-size:10px;color:#858585}
.mobile-back{display:none;width:34px;height:34px;border:1px solid #303030;border-radius:50%;background:#141414;color:#fff}
.chat-scroll{flex:1;min-height:260px;max-height:calc(100dvh - 330px);overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:10px}
.placeholder,.empty,.loading{text-align:center;color:#777;font-size:12px;line-height:1.6;padding:30px 15px;margin:auto}
.bubble{align-self:flex-start;max-width:min(78%,440px);padding:11px 13px;border:1px solid #292929;border-radius:15px 15px 15px 5px;background:#171717;color:#f4f4f4;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:#f0f0f0;color:#080808;border-color:#f0f0f0;border-radius:15px 15px 5px 15px}
.bubble time{display:block;margin-top:5px;font-size:9px;color:#888;text-align:right}
.bubble.mine time{color:#555}
.composer{display:flex;align-items:flex-end;gap:9px;padding:13px;border-top:0;background:#080808}
.composer textarea{flex:1;min-height:42px;max-height:120px;resize:vertical;padding:12px 13px;border-radius:13px;border:1px solid #2b2b2b;background:#141414;color:#fff;outline:none;font-size:13px}
.composer textarea:focus{border-color:#777}
.send,.group-submit{height:42px;padding:0 16px;border:0;border-radius:12px;background:#fff;color:#000;font-size:12px;font-weight:750}
.send:disabled,.group-submit:disabled{opacity:.35;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:80;display:none;max-width:90%;padding:11px 15px;border:1px solid #333;border-radius:12px;background:#171717;color:#fff;font-size:12px}
.toast.show{display:block}
.group-overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;background:#000b}
.group-overlay[hidden]{display:none}
.group-dialog{width:min(100%,440px);max-height:85dvh;overflow:auto;padding:22px;border:1px solid #303030;border-radius:18px;background:#101010}
.group-dialog h2{font-size:17px;margin:0 0 7px}
.group-dialog p{font-size:12px;color:#888;line-height:1.5;margin:0 0 17px}
.group-field{width:100%;height:42px;margin:0 0 10px;padding:0 12px;border:1px solid #303030;border-radius:10px;background:#171717;color:#fff;outline:none}
.group-members{max-height:240px;overflow:auto;margin:8px 0}
.group-person{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:0;font-size:13px}
.group-person input{accent-color:#fff}
#groupSelectionCount{font-size:11px;color:#999;padding:7px 0 12px}
.group-footer{display:flex;justify-content:flex-end;gap:9px}
.group-cancel{height:42px;padding:0 15px;border:1px solid #333;border-radius:11px;background:transparent;color:#fff;font-size:12px}
.demo-date{text-align:center;color:#777;font-size:9px;letter-spacing:1.4px;margin:0 0 10px}
.demo-note{align-self:center;margin-top:12px;padding:7px 11px;border:1px solid #282828;border-radius:20px;color:#777;font-size:9px;text-align:center}
@media(max-width:700px){

 .messages-header{height:66px;padding:0 15px}
 .messages-header h1{font-size:18px}
 .messages-logo{width:43px;height:43px}
 main{padding:0}
 .shell{display:block;min-height:calc(100dvh - 162px);height:calc(100dvh - 162px);border:0;border-radius:0;background:#000}
 .inbox{height:100%;border:0}
 .chat{display:none;height:100%}

 .shell.chat-open .chat{display:flex}
 .mobile-back{display:grid;place-items:center}
 .chat-scroll{max-height:none;min-height:0}
 .inbox-head{padding:13px 15px;border-bottom:0}
 .thread{padding:12px 15px;min-height:72px}
}

<script>
(()=> {

  if(ids.length){
   const {data:members}=await db.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);
   const wanted=[me.id,...draftRecipientIds].sort().join('|');
   const exact=(members||[]).reduce((acc,row)=>{(acc[row.conversation_id]??=[]).push(row.user_id);return acc},{});
   const match=Object.entries(exact).find(([id,users])=>[...users].sort().join('|')===wanted);
   if(match){await openConversation(match[0]);return}
  }
 }
 const isGroup=draftRecipientIds.length>1;
 activePeer=isGroup?{username:draftProfiles.map(p=>p.username).join(', '),group:true,memberCount:draftRecipientIds.length+1}: {...draftProfiles[0],group:false};
 document.body.classList.add('chat-conversation-open');$('shell').classList.add('chat-open');
 renderRecipientHeader();
 $('chatScroll').innerHTML='<div class="placeholder">Votre conversation apparaîtra ici.</div>';
 $('messageBody').disabled=false;$('sendBtn').disabled=false;
}
function renderRecipientHeader(){
 const names=draftProfiles.map(p=>'<span class="recipient-chip">'+esc(p.username)+' <button type="button" data-remove-recipient="'+p.id+'" aria-label="Retirer '+esc(p.username)+'">×</button></span>').join('');
 $('chatHead').innerHTML='<div class="draft-title-row"><button class="mobile-back" id="backInbox" aria-label="Annuler">×</button><strong class="draft-page-title">Nouveau message</strong></div><div class="recipient-area"><strong>À :</strong><div class="recipient-entry">'+names+'<input id="recipientSearch" type="search" placeholder="Rechercher ou ajouter" autocomplete="off"></div><div class="recipient-suggestions" id="recipientSuggestions" hidden></div></div>';
 $('backInbox').onclick=()=>{location.href='messages.html'};
 $('chatHead').querySelectorAll('[data-remove-recipient]').forEach(b=>b.onclick=()=>{draftRecipientIds=draftRecipientIds.filter(id=>id!==b.dataset.removeRecipient);draftProfiles=draftProfiles.filter(p=>p.id!==b.dataset.removeRecipient);if(!draftRecipientIds.length){location.href='new-message.html';return}openDraft(draftRecipientIds)});
 const input=$('recipientSearch');
 input.oninput=()=>renderRecipientSuggestions(input.value);
 input.onfocus=()=>renderRecipientSuggestions(input.value);
}
function renderRecipientSuggestions(query){
 const box=$('recipientSuggestions');if(!box)return;
 const q=(query||'').trim().toLowerCase();
 const rows=recipientDirectory.filter(p=>!draftRecipientIds.includes(p.id)&&p.username.toLowerCase().includes(q)).slice(0,8);
 box.hidden=!q||!rows.length;
 box.innerHTML=rows.map(p=>'<button type="button" data-add-recipient="'+p.id+'">'+avatar(p)+'<span>'+esc(p.username)+'</span></button>').join('');
 box.querySelectorAll('[data-add-recipient]').forEach(b=>b.onclick=async()=>{const id=b.dataset.addRecipient;if(draftRecipientIds.length>=20){toast('Maximum 20 participants.');return}draftRecipientIds.push(id);const p=recipientDirectory.find(x=>x.id===id);if(p)draftProfiles.push(p);renderRecipientHeader();$('recipientSearch').focus();});
}
window.addEventListener('popstate',event=>{
 if(document.body.classList.contains('chat-conversation-open')){
  document.body.classList.remove('chat-conversation-open');
  $('shell').classList.remove('chat-open');
  activeId=null;activePeer=null;draftMode=false;
  clearTimeout(typingTimer);setTyping(false);
  if(realtime){db.removeChannel(realtime);realtime=null}
  history.replaceState({stashInbox:true},'','messages.html');
 }
});
async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(!me){$('openGroup').hidden=true;$('inboxList').innerHTML='<div class="empty">Connecte-toi pour accéder à tes messages.<br><br><button class="action" onclick="location.href=\'auth.html\'">Se connecter</button></div>';return}
await loadThreads();const {data:directory}=await db.from('profiles').select('id,username,avatar_path').neq('id',me.id).order('username').limit(500);recipientDirectory=directory||[];const params=new URLSearchParams(location.search);const target=params.get('conversation');const draft=params.get('draft');history.replaceState({stashInbox:true},'','messages.html');if(target)await openConversation(target);else if(draft)await openDraft(draft.split(','))}
async function loadThreads(){const {data:members,error}=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(error){$('inboxList').innerHTML='<div class="empty">Impossible de charger les conversations.</div>';console.error(error);return}
const ids=[...new Set((members||[]).map(x=>x.conversation_id))];if(!ids.length){threads=[];$('inboxList').innerHTML='<div class="empty">Tu n’as pas encore de conversation.<br><br><a href="new-message.html" style="color:#fff;text-decoration:underline">Écrire ton premier message</a></div>';applyThreadSearch();return}
const [{data:allMembers},{data:allMessages},{data:conversationRows}]=await Promise.all([
db.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids),
db.from('messages').select('id,conversation_id,sender_id,body,created_at,read_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(300),
db.from('conversations').select('id,title').in('id',ids)
]);
const messageIds=(allMessages||[]).map(m=>m.id);let readSet=new Set();
if(messageIds.length){const {data:reads}=await db.from('message_reads').select('message_id').eq('user_id',me.id).in('message_id',messageIds);(reads||[]).forEach(r=>readSet.add(r.message_id))}
const memberIds=[...new Set((allMembers||[]).map(x=>x.user_id))];let profiles={};
if(memberIds.length){const {data}=await db.from('profiles').select('id,username,avatar_path').in('id',memberIds);(data||[]).forEach(p=>profiles[p.id]=p)}
const titles={};(conversationRows||[]).forEach(c=>titles[c.id]=c.title);
threads=ids.map(id=>{const people=(allMembers||[]).filter(x=>x.conversation_id===id&&x.user_id!==me.id);const msgs=(allMessages||[]).filter(m=>m.conversation_id===id);const last=msgs[0];const isGroup=people.length>1;const unread=msgs.filter(m=>m.sender_id!==me.id&&(isGroup?!readSet.has(m.id):!m.read_at)).length;const names=people.map(x=>profiles[x.user_id]?.username||'Membre');const peer=isGroup?{username:titles[id]||names.join(', '),group:true,memberCount:people.length+1}:{...(profiles[people[0]?.user_id]||{username:'Membre'}),group:false};return {id,peerId:people[0]?.user_id,peer,isGroup,memberCount:people.length+1,last,unread}}).sort((a,b)=>new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0));

$('inboxList').innerHTML=threads.map(t=>`<button class="thread ${t.id===activeId?'active':''}" data-thread="${t.id}">${avatar(t.peer)}<span class="thread-copy"><span class="thread-top"><strong>${esc(t.peer.username)}</strong><small>${esc(t.last?ago(t.last.created_at):'')}</small></span><span class="preview">${t.last?(t.last.sender_id===me.id?'Toi : ':'')+esc(t.last.body):'Nouvelle conversation'}</span></span>${t.unread?'<span class="unread-count">'+t.unread+'</span>':''}</button>`).join('');
$('inboxList').querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>openConversation(b.dataset.thread));
applyThreadSearch();
}
async function openConversation(id,fromInitialUrl=false){
 if(!threads.some(t=>t.id===id)){
  const {data:membership}=await db.from('conversation_members').select('user_id').eq('conversation_id',id).eq('user_id',me.id).maybeSingle();
  if(!membership){toast('Cette conversation est introuvable.');return}
  await loadThreads();
 }
 const t=threads.find(x=>x.id===id);if(!t)return;
 if(!fromInitialUrl)history.pushState({stashConversation:id},'','messages.html?conversation='+encodeURIComponent(id));
 document.body.classList.add('chat-conversation-open');
 activeId=id;activePeer=t.peer;$('shell').classList.add('chat-open');
 $('chatHead').innerHTML='<button class="mobile-back" id="backInbox">←</button>'+avatar(t.peer)+'<div class="chat-title-copy"><strong>'+esc(t.peer.username)+'</strong><small id="typingStatus">'+(t.isGroup?'Groupe · '+t.memberCount+' membres':'Conversation privée')+'</small></div>';
 $('backInbox').onclick=()=>history.back();
 $('messageBody').disabled=false;$('sendBtn').disabled=false;
 await loadMessages();await db.rpc('mark_conversation_read',{p_conversation_id:id});await loadThreads();subscribe(id);
}

async function loadMessages(){
 if(!activeId||loadingMessages)return;
 loadingMessages=true;
 const {data,error}=await db.from('messages').select('id,conversation_id,sender_id,body,created_at,read_at').eq('conversation_id',activeId).order('created_at',{ascending:false}).limit(200);
 loadingMessages=false;
 if(error){toast('Impossible de charger les messages.');console.error(error);return}
 const rows=(data||[]).reverse();activeMessageIds=rows.map(m=>m.id);
 let senders={},readCounts={};
 if(activePeer&&activePeer.group&&rows.length){
  const ids=[...new Set(rows.map(m=>m.sender_id).filter(id=>id&&id!==me.id))];
  if(ids.length){const {data:people}=await db.from('profiles').select('id,username').in('id',ids);(people||[]).forEach(p=>senders[p.id]=p.username)}
  const {data:reads,error:readError}=await db.from('message_reads').select('message_id,user_id').in('message_id',activeMessageIds);
  if(!readError)(reads||[]).forEach(r=>{readCounts[r.message_id]=(readCounts[r.message_id]||0)+1});
 }
 const totalReaders=Math.max(1,(activePeer?.memberCount||2)-1);
 $('chatScroll').innerHTML=rows.length?rows.map(m=>{
  const mine=m.sender_id===me.id;
  const receipt=mine?(activePeer?.group?(readCounts[m.id]?' · Lu par '+readCounts[m.id]+'/'+totalReaders:''):(m.read_at?' · Lu':'')):'';
  const sender=activePeer&&activePeer.group&&!mine?'<strong style="display:block;font-size:10px;color:#ffb6d7;margin-bottom:4px">'+esc(m.sender_id?(senders[m.sender_id]||'Membre'):'Compte supprimé')+'</strong>':'';
  return '<div class="bubble '+(mine?'mine':'')+'">'+sender+esc(m.body)+'<time>'+new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+receipt+'</time></div>';
 }).join(''):'<div class="placeholder">Début de votre conversation. Dis bonjour 👋</div>';
 $('chatScroll').scrollTop=$('chatScroll').scrollHeight;
}

function applyThreadSearch(){
 const q=($('inboxSearch')?.value||'').trim().toLowerCase();
 const list=$('inboxList');
 list.querySelector('.search-empty')?.remove();
 const rows=[...list.querySelectorAll('[data-thread]')];
 let visible=0;
 rows.forEach(row=>{
  const match=!q||row.textContent.toLowerCase().includes(q);
  row.hidden=!match;
  if(match)visible++;
 });
 if(q&&visible===0){
  const empty=document.createElement('div');
  empty.className='search-empty';
  empty.textContent='Aucune conversation trouvée.';
  list.appendChild(empty);
 }
}
$('inboxSearch').addEventListener('input',applyThreadSearch);

function renderTyping(){
 const status=$('typingStatus');if(!status||!realtime)return;
 const people=Object.values(realtime.presenceState()||{}).flat().filter(p=>p.user_id!==me.id&&p.typing);
 status.textContent=people.length?(activePeer?.group?'Un membre est en train d’écrire…':'Est en train d’écrire…'):(activePeer?.group?'Groupe · '+(threads.find(t=>t.id===activeId)?.memberCount||'')+' membres':'Conversation privée');
}
async function setTyping(value){
 if(!realtime||isTyping===value)return;
 isTyping=value;
 try{await realtime.track({user_id:me.id,typing:value})}catch(err){console.warn('Typing presence:',err)}
}
function subscribe(id){
 if(realtime){db.removeChannel(realtime);realtime=null}
 clearTimeout(typingTimer);isTyping=false;
 realtime=db.channel('confess-dm:'+id,{config:{presence:{key:me.id}}})
  .on('presence',{event:'sync'},renderTyping)
  .on('presence',{event:'join'},renderTyping)
  .on('presence',{event:'leave'},renderTyping)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},async payload=>{
   await loadMessages();
   if(payload.new.sender_id!==me.id)await db.rpc('mark_conversation_read',{p_conversation_id:id});
   await loadThreads();
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},async()=>{await loadMessages();await loadThreads()})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'message_reads'},async payload=>{
   if(activeMessageIds.includes(payload.new.message_id))await loadMessages();
  })
  .subscribe(async status=>{
   if(status==='SUBSCRIBED'){try{await realtime.track({user_id:me.id,typing:false})}catch(err){console.warn(err)}}
   else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('STASH Realtime:',status);
  });
 renderTyping();
}

async function send(){
 const body=$('messageBody').value.trim();if(!body)return;
 clearTimeout(typingTimer);await setTyping(false);
 const btn=$('sendBtn');btn.disabled=true;
 if(!activeId&&draftMode){
  let created;
  if(draftRecipientIds.length===1){
   created=await db.rpc('create_direct_conversation',{p_recipient_id:draftRecipientIds[0]});
  }else{
   const names=draftProfiles.map(p=>p.username);
   let title=names.slice(0,3).join(', ')+(names.length>3?' + '+(names.length-3):'');
   if(title.length>60)title=title.slice(0,57)+'…';
   created=await db.rpc('create_group_conversation',{p_title:title,p_member_ids:draftRecipientIds});
  }
  if(created.error){btn.disabled=false;toast(created.error.message||'Impossible de créer la conversation.');return}
  activeId=created.data;draftMode=false;
  history.pushState({stashConversation:activeId},'', 'messages.html?conversation='+encodeURIComponent(activeId));
  await loadThreads();
  const found=threads.find(t=>t.id===activeId);
  if(found){activePeer=found.peer;$('chatHead').innerHTML='<button class="mobile-back" id="backInbox">←</button>'+avatar(found.peer)+'<div class="chat-title-copy"><strong>'+esc(found.peer.username)+'</strong><small id="typingStatus">'+(found.isGroup?'Groupe · '+found.memberCount+' membres':'Conversation privée')+'</small></div>';$('backInbox').onclick=()=>{document.body.classList.remove('chat-conversation-open');$('shell').classList.remove('chat-open')}}
  subscribe(activeId);
 }
 const {error}=await db.rpc('send_direct_message',{p_conversation_id:activeId,p_body:body});
 btn.disabled=false;
 if(error){toast(error.message||'Envoi impossible.');return}
 $('messageBody').value='';await loadMessages();await loadThreads();
}
$('sendBtn').onclick=send;
$('messageBody').addEventListener('input',()=>{
 clearTimeout(typingTimer);
 if(!$('messageBody').value.trim()){setTyping(false);return}
 setTyping(true);typingTimer=setTimeout(()=>setTyping(false),1600);
});
$('messageBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeId){loadMessages();db.rpc('mark_conversation_read',{p_conversation_id:activeId})}});
window.addEventListener('beforeunload',()=>{clearTimeout(typingTimer);if(realtime){realtime.untrack();db.removeChannel(realtime)}});
init();
})();
