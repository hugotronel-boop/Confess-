<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e1b"><title>CONFESS — Profil membre</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
<style>
:root{color-scheme:dark;--bg:#100e1b;--panel:#1b1830;--muted:#aaa5c0;--pink:#ff5ba7;--orange:#ff9b5b;--line:#39334f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,#38204b 0,transparent 30%),var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:35px}.top{position:sticky;top:0;background:#100e1bed;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:12px max(16px,calc((100vw - 900px)/2));display:flex;justify-content:space-between;align-items:center;z-index:3}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;font-weight:950;font-size:21px;color:#201326}.brand strong{letter-spacing:2px;font-size:19px}.back,.follow{border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:30px;padding:10px 14px;font-size:12px}.follow.on{background:#ff5ba71c;border-color:#ff5ba7;color:#ff9bc9}.message-btn{border:0;background:linear-gradient(100deg,var(--pink),var(--orange));color:#241326;border-radius:30px;padding:10px 14px;font-size:12px;font-weight:850;margin-left:6px}.message-btn:disabled,.follow:disabled{opacity:.55}main{width:min(760px,100%);margin:25px auto;padding:0 15px}.hero{background:linear-gradient(125deg,#42203f,#26203f 62%,#30203c);border:1px solid #ffffff14;border-radius:25px;padding:24px;margin-bottom:15px}.profile{display:flex;align-items:center;gap:17px}.avatar{width:94px;height:94px;border-radius:28px;background:linear-gradient(135deg,#ff5ba7,#8f6bff);display:grid;place-items:center;font-size:34px;font-weight:850;overflow:hidden;border:2px solid #ffffff20;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.info{min-width:0;flex:1}.info h1{font-size:22px;margin:0 0 5px;overflow-wrap:anywhere}.handle,.since{font-size:12px;color:#ded4e8;margin:0 0 5px}.bio{font-size:13px;line-height:1.55;color:#eee;margin:15px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:flex;gap:22px;margin-top:17px;padding-top:15px;border-top:1px solid #ffffff20}.stat strong{display:block;font-size:17px}.stat span{font-size:11px;color:#ded4e8}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 12px}.section-head h2{font-size:17px;margin:0}.post{background:var(--panel);border:1px solid #ffffff13;border-radius:18px;padding:16px;margin-bottom:11px}.post-meta{font-size:11px;color:var(--muted);margin-bottom:10px}.post-body{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.empty,.loading{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#302744;border:1px solid #ffffff22;color:#fff;padding:12px 16px;border-radius:13px;font-size:12px;z-index:20;display:none;max-width:90%;text-align:center}.toast.show{display:block}@media(max-width:520px){main{margin:16px auto}.hero{padding:18px}.avatar{width:78px;height:78px;border-radius:24px}.profile{gap:13px}}
</style></head><body><header class="top"><div class="brand"><div class="mark">C</div><strong>CONFESS</strong></div><button class="back" onclick="location.href='index.html'">← Retour au fil</button></header><main><section class="hero"><div class="profile"><div class="avatar" id="avatar">?</div><div class="info"><h1 id="name">Profil membre</h1><p class="handle" id="handle"></p><p class="since" id="since"></p><button class="follow" id="followBtn" hidden>S'abonner</button><button class="message-btn" id="messageBtn" hidden>💬 Message</button></div></div><p class="bio" id="bio"></p><div class="stats"><div class="stat"><strong id="postsCount">—</strong><span>Publications</span></div><div class="stat"><strong id="followersCount">—</strong><span>Abonnés</span></div><div class="stat"><strong id="followingCount">—</strong><span>Abonnements</span></div></div></section><div class="section-head"><h2>Publications publiques</h2></div><div id="posts"><div class="loading">Chargement du profil…</div></div></main><div class="toast" id="toast"></div>
<script>(()=>{const URL='https://hhntssweslmmqskhoaje.supabase.co',KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),memberId=new URLSearchParams(location.search).get('id');let me=null,following=false;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!memberId){$('posts').innerHTML='<div class="empty">Profil introuvable.</div>';return}const {data:{session}}=await db.auth.getSession();me=session?.user||null;const {data:p,error}=await db.from('profiles').select('id,username,bio,avatar_path,created_at').eq('id',memberId).maybeSingle();if(error||!p){$('posts').innerHTML='<div class="empty">Ce profil est introuvable ou indisponible.</div>';return}
$('name').textContent=p.username||'Membre CONFESS';$('handle').textContent='@'+p.username;$('since').textContent='Membre depuis '+new Date(p.created_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});$('bio').textContent=p.bio||'Ce membre n’a pas encore ajouté de présentation.';if(p.avatar_path){const {data}=db.storage.from('confess-avatars').getPublicUrl(p.avatar_path);$('avatar').innerHTML='<img alt="Photo de profil" src="'+esc(data.publicUrl)+'">'}else $('avatar').textContent=(p.username||'?')[0].toUpperCase();
const [{count:postCount},{count:followers},{count:followingCount}]=await Promise.all([db.from('posts').select('id',{count:'exact',head:true}).eq('author_profile_id',memberId).eq('is_anonymous',false).eq('status','published'),db.from('user_follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',memberId),db.from('user_follows').select('followed_id',{count:'exact',head:true}).eq('follower_id',memberId)]);
$('postsCount').textContent=postCount??0;$('followersCount').textContent=followers??0;$('followingCount').textContent=followingCount??0;
if(me&&me.id!==memberId){$('followBtn').hidden=false;$('messageBtn').hidden=false;const {data:f}=await db.from('user_follows').select('follower_id').eq('follower_id',me.id).eq('followed_id',memberId).maybeSingle();following=!!f;paintFollow()}
$('followBtn').onclick=toggleFollow;
$('messageBtn').onclick=async()=>{if(!me){location.href='auth.html';return}$('messageBtn').disabled=true;const {data,error}=await db.rpc('start_direct_conversation',{p_target_user_id:memberId});$('messageBtn').disabled=false;if(error){toast(error.message||'Impossible de démarrer la conversation.');return}location.href='messages.html?conversation='+encodeURIComponent(data)};
const {data:posts,error:postError}=await db.from('posts').select('id,body,created_at,categories(label)').eq('author_profile_id',memberId).eq('is_anonymous',false).eq('status','published').order('created_at',{ascending:false}).limit(50);
if(postError){$('posts').innerHTML='<div class="empty">Impossible de charger les publications.</div>';return}
$('posts').innerHTML=posts?.length?posts.map(x=>'<article class="post"><div class="post-meta">'+new Date(x.created_at).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})+' · '+esc(x.categories?.label||'Discussion')+'</div><div class="post-body">'+esc(x.body)+'</div></article>').join(''):'<div class="empty">Aucune publication publique pour le moment.</div>';
}
function paintFollow(){$('followBtn').textContent=following?'✓ Abonné':'＋ S’abonner';$('followBtn').classList.toggle('on',following)}
async function toggleFollow(){if(!me){location.href='auth.html';return}$('followBtn').disabled=true;let res;if(following)res=await db.from('user_follows').delete().eq('follower_id',me.id).eq('followed_id',memberId);else res=await db.from('user_follows').insert({follower_id:me.id,followed_id:memberId});$('followBtn').disabled=false;if(res.error){toast('Impossible de modifier cet abonnement.');console.error(res.error);return}following=!following;paintFollow();const {count}=await db.from('user_follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',memberId);$('followersCount').textContent=count??0;toast(following?'Tu suis maintenant ce membre !':'Abonnement retiré.')}
load()})();</script></body></html>
