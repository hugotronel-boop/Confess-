<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e1b"><title>CONFESS — Profil membre</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
<style>
:root{color-scheme:dark;--bg:#100e1b;--panel:#1b1830;--muted:#aaa5c0;--pink:#ff5ba7;--orange:#ff9b5b;--line:#39334f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,#38204b 0,transparent 30%),var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:35px}.top{position:sticky;top:0;background:#100e1bed;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:12px max(16px,calc((100vw - 900px)/2));display:flex;justify-content:space-between;align-items:center;z-index:3}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;font-weight:950;font-size:21px;color:#201326}.brand strong{letter-spacing:2px;font-size:19px}.back,.follow{border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:30px;padding:10px 14px;font-size:12px}.follow.on{background:#ff5ba71c;border-color:#ff5ba7;color:#ff9bc9}.message-btn{border:0;background:linear-gradient(100deg,var(--pink),var(--orange));color:#241326;border-radius:30px;padding:10px 14px;font-size:12px;font-weight:850;margin-left:6px}.message-btn:disabled,.follow:disabled{opacity:.55}main{width:min(760px,100%);margin:25px auto;padding:0 15px}.hero{background:linear-gradient(125deg,#42203f,#26203f 62%,#30203c);border:1px solid #ffffff14;border-radius:25px;padding:24px;margin-bottom:15px}.cover{height:165px;border-radius:17px;overflow:hidden;margin-bottom:18px;background:linear-gradient(120deg,#ff5ba7,#8f6bff 55%,#ff9b5b);border:1px solid #ffffff20}.cover img{width:100%;height:100%;object-fit:cover}.profile{display:flex;align-items:center;gap:17px}.avatar{width:94px;height:94px;border-radius:28px;background:linear-gradient(135deg,#ff5ba7,#8f6bff);display:grid;place-items:center;font-size:34px;font-weight:850;overflow:hidden;border:2px solid #ffffff20;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.info{min-width:0;flex:1}.info h1{font-size:22px;margin:0 0 5px;overflow-wrap:anywhere}.handle,.since{font-size:12px;color:#ded4e8;margin:0 0 5px}.bio{font-size:13px;line-height:1.55;color:#eee;margin:15px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:flex;gap:22px;margin-top:17px;padding-top:15px;border-top:1px solid #ffffff20}.stat strong{display:block;font-size:17px}.stat span{font-size:11px;color:#ded4e8}.tabbar{display:flex;gap:8px;background:#151225;padding:6px;border:1px solid var(--line);border-radius:15px;margin:18px 0 14px}.tab-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:11px;font-size:12px;font-weight:800}.tab-btn.active{background:linear-gradient(100deg,#ff5ba733,#ff9b5b22);color:#fff}.pinned-tag{display:inline-flex;align-items:center;gap:5px;color:#ffb6d7;font-size:10px;font-weight:800;margin-bottom:8px}.about-panel{background:var(--panel);border:1px solid #ffffff13;border-radius:18px;padding:18px;line-height:1.6;font-size:13px;color:#e9e1f2;white-space:pre-wrap;overflow-wrap:anywhere}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 12px}.section-head h2{font-size:17px;margin:0}.post{background:var(--panel);border:1px solid #ffffff13;border-radius:18px;padding:16px;margin-bottom:11px}.post-meta{font-size:11px;color:var(--muted);margin-bottom:10px}.post-body{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.empty,.loading{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#302744;border:1px solid #ffffff22;color:#fff;padding:12px 16px;border-radius:13px;font-size:12px;z-index:20;display:none;max-width:90%;text-align:center}.toast.show{display:block}@media(max-width:520px){main{margin:16px auto}.hero{padding:18px}.avatar{width:78px;height:78px;border-radius:24px}.profile{gap:13px}}

.confess-bell{position:relative;border:1px solid var(--line,#39334f);background:var(--panel,#1b1830);color:#fff;border-radius:30px;padding:9px 12px;font-size:16px;cursor:pointer;margin-left:8px}.confess-bell-count{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:20px;background:#ff5ba7;color:#241326;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px}.confess-bell-count[hidden]{display:none}
</style></head><body><header class="top"><div class="brand"><div class="mark">C</div><strong>CONFESS</strong></div><button class="back" onclick="location.href='index.html'">← Retour au fil</button><button class="confess-bell" id="confessBell" aria-label="Notifications">🔔<span class="confess-bell-count" id="confessBellCount" hidden>0</span></button></header><main><section class="hero"><div class="cover" id="cover"></div><div class="profile"><div class="avatar" id="avatar">?</div><div class="info"><h1 id="name">Profil membre</h1><p class="handle" id="handle"></p><p class="since" id="since"></p><button class="follow" id="followBtn" hidden>S'abonner</button><button class="message-btn" id="messageBtn" hidden>💬 Message</button><div class="moderation-actions" id="moderationActions" hidden><button id="blockBtn">🚫 Bloquer</button><button id="muteBtn">🙈 Masquer</button><button id="reportMemberBtn">⚑ Signaler</button></div></div></div><p class="bio" id="bio"></p><div class="stats"><div class="stat"><strong id="postsCount">—</strong><span>Publications</span></div><div class="stat"><strong id="followersCount">—</strong><span>Abonnés</span></div><div class="stat"><strong id="followingCount">—</strong><span>Abonnements</span></div></div></section><div class="tabbar" role="tablist"><button class="tab-btn active" data-tab="posts" role="tab" aria-selected="true">📝 Publications</button><button class="tab-btn" data-tab="about" role="tab" aria-selected="false">👤 À propos</button></div><div id="postsTab"><div class="section-head"><h2>Publications publiques</h2></div><div id="posts"><div class="loading">Chargement du profil…</div></div></div><div id="aboutTab" hidden><div class="about-panel" id="aboutContent"></div></div></main><div class="toast" id="toast"></div>
<script>(()=>{const URL='https://hhntssweslmmqskhoaje.supabase.co',KEY='sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),memberId=new URLSearchParams(location.search).get('id');let me=null,following=false;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!memberId){$('posts').innerHTML='<div class="empty">Profil introuvable.</div>';return}const {data:{session}}=await db.auth.getSession();me=session?.user||null;const {data:p,error}=await db.from('profiles').select('id,username,bio,avatar_path,cover_path,created_at').eq('id',memberId).maybeSingle();if(error||!p){$('posts').innerHTML='<div class="empty">Ce profil est introuvable ou indisponible.</div>';return}
if(p.cover_path){const {data:coverData}=db.storage.from('confess-avatars').getPublicUrl(p.cover_path);$('cover').innerHTML='<img alt="Bannière de profil" src="'+esc(coverData.publicUrl)+'">'}$('name').textContent=p.username||'Membre CONFESS';$('handle').textContent='@'+p.username;$('since').textContent='Membre depuis '+new Date(p.created_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});$('bio').textContent=p.bio||'Ce membre n’a pas encore ajouté de présentation.';$('aboutContent').textContent=(p.bio||'Ce membre n’a pas encore ajouté de présentation.')+'\n\nMembre depuis '+new Date(p.created_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});if(p.avatar_path){const {data}=db.storage.from('confess-avatars').getPublicUrl(p.avatar_path);$('avatar').innerHTML='<img alt="Photo de profil" src="'+esc(data.publicUrl)+'">'}else $('avatar').textContent=(p.username||'?')[0].toUpperCase();
const [{count:postCount},{count:followers},{count:followingCount}]=await Promise.all([db.from('posts').select('id',{count:'exact',head:true}).eq('author_profile_id',memberId).eq('is_anonymous',false).eq('status','published'),db.from('user_follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',memberId),db.from('user_follows').select('followed_id',{count:'exact',head:true}).eq('follower_id',memberId)]);
$('postsCount').textContent=postCount??0;$('followersCount').textContent=followers??0;$('followingCount').textContent=followingCount??0;
if(me&&me.id!==memberId){$('followBtn').hidden=false;$('messageBtn').hidden=false;$('moderationActions').hidden=false;const [{data:f},{data:block},{data:mute}]=await Promise.all([db.from('user_follows').select('follower_id').eq('follower_id',me.id).eq('followed_id',memberId).maybeSingle(),db.from('user_blocks').select('blocked_id').eq('blocker_id',me.id).eq('blocked_id',memberId).maybeSingle(),db.from('user_mutes').select('muted_user_id').eq('user_id',me.id).eq('muted_user_id',memberId).maybeSingle()]);following=!!f;paintFollow();paintSafety(!!block,!!mute)}
$('followBtn').onclick=toggleFollow;
$('blockBtn').onclick=toggleBlock;$('muteBtn').onclick=toggleMute;$('reportMemberBtn').onclick=reportMember;
$('messageBtn').onclick=async()=>{if(!me){location.href='auth.html';return}$('messageBtn').disabled=true;const {data,error}=await db.rpc('start_direct_conversation',{p_target_user_id:memberId});$('messageBtn').disabled=false;if(error){toast(error.message||'Impossible de démarrer la conversation.');return}location.href='messages.html?conversation='+encodeURIComponent(data)};
const {data:posts,error:postError}=await db.from('posts').select('id,body,created_at,is_pinned,categories(label)').eq('author_profile_id',memberId).eq('is_anonymous',false).eq('status','published').order('is_pinned',{ascending:false}).order('created_at',{ascending:false}).limit(50);
if(postError){$('posts').innerHTML='<div class="empty">Impossible de charger les publications.</div>';return}
$('posts').innerHTML=posts?.length?posts.map(x=>'<article class="post">'+(x.is_pinned?'<div class="pinned-tag">📌 PUBLICATION ÉPINGLÉE</div>':'')+'<div class="post-meta">'+new Date(x.created_at).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})+' · '+esc(x.categories?.label||'Discussion')+'</div><div class="post-body">'+esc(x.body)+'</div></article>').join(''):'<div class="empty">Aucune publication publique pour le moment.</div>';
}
function paintSafety(blocked,muted){$('blockBtn').textContent=blocked?'✓ Débloquer':'🚫 Bloquer';$('blockBtn').classList.toggle('danger',blocked);$('muteBtn').textContent=muted?'✓ Réafficher':'🙈 Masquer';$('muteBtn').classList.toggle('danger',muted)}
async function toggleBlock(){if(!me)return;const blocked=$('blockBtn').textContent.includes('Débloquer');$('blockBtn').disabled=true;let result;if(blocked)result=await db.from('user_blocks').delete().eq('blocker_id',me.id).eq('blocked_id',memberId);else result=await db.from('user_blocks').insert({blocker_id:me.id,blocked_id:memberId});$('blockBtn').disabled=false;if(result.error){toast('Impossible de modifier le blocage.');console.error(result.error);return}const muted=$('muteBtn').textContent.includes('Réafficher');paintSafety(!blocked,muted);toast(blocked?'Membre débloqué.':'Membre bloqué. Les nouveaux messages sont empêchés.')}
async function toggleMute(){if(!me)return;const muted=$('muteBtn').textContent.includes('Réafficher');$('muteBtn').disabled=true;let result;if(muted)result=await db.from('user_mutes').delete().eq('user_id',me.id).eq('muted_user_id',memberId);else result=await db.from('user_mutes').insert({user_id:me.id,muted_user_id:memberId});$('muteBtn').disabled=false;if(result.error){toast('Impossible de modifier les comptes masqués.');console.error(result.error);return}const blocked=$('blockBtn').textContent.includes('Débloquer');paintSafety(blocked,!muted);toast(muted?'Membre réaffiché.':'Membre masqué dans tes préférences.')}
async function reportMember(){if(!me)return toast('Connecte-toi pour signaler un membre.');const reasons=['spam','harassment','hate','violence','sexual','self_harm','privacy','other'];const pick=prompt('Motif du signalement :\n1. Spam ou publicité\n2. Harcèlement\n3. Discours haineux\n4. Violence ou menace\n5. Contenu sexuel\n6. Automutilation\n7. Atteinte à la vie privée\n8. Autre');if(!pick)return;const index=Number(pick)-1;if(!Number.isInteger(index)||index<0||index>=reasons.length)return toast('Choisis un motif entre 1 et 8.');const details=prompt('Précisions (facultatif) :')||'';const {error}=await db.from('reports').insert({reporter_id:me.id,reported_user_id:memberId,reason:reasons[index],details:details.slice(0,2000)});if(error){toast("Le signalement n'a pas pu être envoyé.");console.error(error)}else toast('Merci, ton signalement a été transmis à la modération.')}
function paintFollow(){$('followBtn').textContent=following?'✓ Abonné':'＋ S’abonner';$('followBtn').classList.toggle('on',following)}
async function toggleFollow(){if(!me){location.href='auth.html';return}$('followBtn').disabled=true;let res;if(following)res=await db.from('user_follows').delete().eq('follower_id',me.id).eq('followed_id',memberId);else res=await db.from('user_follows').insert({follower_id:me.id,followed_id:memberId});$('followBtn').disabled=false;if(res.error){toast('Impossible de modifier cet abonnement.');console.error(res.error);return}following=!following;paintFollow();const {count}=await db.from('user_follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',memberId);$('followersCount').textContent=count??0;toast(following?'Tu suis maintenant ce membre !':'Abonnement retiré.')}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{const postsTab=btn.dataset.tab==='posts';$('postsTab').hidden=!postsTab;$('aboutTab').hidden=postsTab;document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===btn.dataset.tab;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))})}));load()})();</script><script>
(()=> {
 if(!window.supabase?.createClient)return;
 const client=window.supabase.createClient('https://hhntssweslmmqskhoaje.supabase.co','sb_publishable_QTzVtS2OeSMsL6lHZZ1WLA_BnGPLpy3');
 const badge=document.getElementById('confessBellCount');
 let channel=null,userId=null;
 async function countUnread(){
  const {data:{session}}=await client.auth.getSession();
  const id=session?.user?.id||null;
  if(!id){badge.hidden=true;return}
  const {count,error}=await client.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',id).eq('is_read',false);
  if(error){console.warn('CONFESS notifications:',error.message);return}
  badge.textContent=(count||0)>99?'99+':String(count||0);
  badge.hidden=!count;
 }
 async function connect(id){
  if(id===userId&&channel)return;
  if(channel){await client.removeChannel(channel);channel=null}
  userId=id;
  if(!id){badge.hidden=true;return}
  channel=client.channel('confess-page-notifications-'+id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:'user_id=eq.'+id},countUnread)
   .subscribe();
  countUnread();
 }
 async function init(){const {data:{session}}=await client.auth.getSession();await connect(session?.user?.id||null)}
 document.getElementById('confessBell').addEventListener('click',()=>location.href='notifications.html');
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){connect(null);return}
  if(session?.user?.id)setTimeout(()=>connect(session.user.id),0);
 });
 init();
 window.addEventListener('beforeunload',()=>{if(channel)client.removeChannel(channel)});
})();
</script>
